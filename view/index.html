                pkPut(s, Math.max(0, Math.min(to, pkMaxRaiseTo(s)) - s.bet));
                const by = s.bet - before;
                if (by >= pk.minRaise) {
                    pk.minRaise = by;
                }
                if (s.bet > before) {
                    pk.currentBet = s.bet;
                    pk.lastRaiser = i;
                    // everyone else still in has to answer it
                    pk.seats.forEach((x, k) => {
                        if (k !== i && pkCanAct(x)) x.acted = false;
                    });
                }
                log(t(s.allIn ? "pkLogAllIn" : before === 0 ? "pkLogBet" : "pkLogRaise", { who: s.name, n: s.bet }), "pk-log");
                mine = [s.allIn ? "pPkAllIn" : before === 0 ? "pPkBet" : "pPkRaise", { n: s.bet }];
                // one line about it, from the one who did it or the next NPC to answer
                const speaker = s.human ? pkSpeakerAfter(i) : s;
                const line = s.allIn ? "pkAllInLine" : before === 0 ? "pkBetLine" : "pkRaiseLine";
                if (speaker) comment = [speaker.id, t(line, { who: s.name, n: s.bet, pot: pkPot() })];
            }
            // the player says their move first (kept: it is not dropped for a newer line), then
            // the NPC answers a bet; the NPCs' own bets are told by themselves
            if (s.human && playerVoice && mine) {
                say(PLAYER_ID, t(mine[0], mine[1]), true);
            }
            if (comment) {
                say(comment[0], comment[1]);
            }
            s.acted = true;
            pkAfterAction(i);
        }

        // The NPC who answers next after seat i, or the first still in.
        function pkSpeakerAfter(i) {
            const k = pkNext(i, (x) => !x.human && pkInPlay(x));
            return k >= 0 ? pk.seats[k] : pk.seats.find((x) => !x.human);
        }

        function pkAfterAction(i) {
            const inPlay = pk.seats.filter(pkInPlay);
            if (inPlay.length === 1) {
                pkFoldWin(pk.seats.indexOf(inPlay[0]));
                return;
            }
            const pending = (x) => pkCanAct(x) && (!x.acted || x.bet < pk.currentBet);
            const next = pkNext(i, pending);
            if (next >= 0) {
                pk.turn = next;
                pk.raiseTo = 0;
                reportPkState();
                pkStep();
                return;
            }
            // the street is done
            if (pk.street === 3) {
                pkShowdown();
            } else if (pk.seats.filter(pkCanAct).length <= 1) {
                pkRunOut();
            } else {
                pkNextStreet();
            }
        }

        function pkDealBoard() {
            const n = pk.street === 1 ? 3 : 1;
            const cards = [];
            for (let k = 0; k < n; k++) cards.push(pk.deck.pop());
            pk.board.push(...cards);
            log(t("pkLogBoard", { street: t(["", "pkFlop", "pkTurn", "pkRiver"][pk.street]), cards: pkCardsText(cards) }), "pk-log");
        }

        function pkNextStreet() {
            pk.street++;
            pk.seats.forEach((s) => {
                s.bet = 0;
                s.acted = false;
            });
            pk.currentBet = 0;
            pk.minRaise = PK_BIG;
            pk.lastRaiser = -1;
            pkDealBoard();
            pk.turn = pkNext(pk.button, pkCanAct);
            pk.raiseTo = 0;
            reportPkState();
            pkStep();
        }

        // No more betting can happen: the rest of the cards come out, then the showdown.
        function pkRunOut() {
            while (pk.street < 3) {
                pk.street++;
                pkDealBoard();
            }
            pkShowdown();
        }

        // An uncalled bet goes back to whoever made it.
        function pkReturnUncalled() {
            const totals = pk.seats.map((s) => s.total).sort((a, b) => b - a);
            const top = pk.seats.find((s) => s.total === totals[0]);
            if (totals[0] > totals[1]) {
                const back = totals[0] - totals[1];
                top.total -= back;
                top.chips += back;
                if (top.chips > 0) top.allIn = false;
            }
        }

        // Everyone else folded.
        function pkFoldWin(w) {
            pkReturnUncalled();
            const s = pk.seats[w];
            const pot = pkPot();
            s.chips += pot;
            s.won = pot;
            pk.results = t("pkResultTake", { name: s.name, n: pot });
            log(t("pkLogWin", { who: s.name, n: pot, hand: "" }), "pk-log");
            const big = pot >= PK_BIG * 4;
            pkHandOver(big ? t("pkFoldWinLine", { who: s.name, n: pot }) : "", s.human ? null : s);
        }

        // The cards of those still in come up, and each pot goes to the best hand that may win it.
        function pkShowdown() {
            pk.showdown = true;
            pkReturnUncalled();
            const contenders = pk.seats.filter(pkInPlay);
            contenders.forEach((s) => { s.score = pkBest([...s.cards, ...pk.board]); });
            // side pots: one for each amount an all-in player could match
            const levels = [...new Set(contenders.map((s) => s.total))].sort((a, b) => a - b);
            levels.forEach((level, j) => {
                const prev = j ? levels[j - 1] : 0;
                const cap = j === levels.length - 1 ? Infinity : level;
                const amount = pk.seats.reduce((n, s) => n + Math.min(s.total, cap) - Math.min(s.total, prev), 0);
                const eligible = contenders.filter((s) => s.total >= level);
                const best = Math.max(...eligible.map((s) => s.score));
                const winners = eligible.filter((s) => s.score === best);
                const share = Math.floor(amount / winners.length);
                winners.forEach((s) => { s.chips += share; s.won += share; });
                // what does not split evenly goes to the first winner after the dealer
                const rest = amount - share * winners.length;
                if (rest > 0) {
                    const first = pk.seats[pkNext(pk.button, (x) => winners.includes(x))];
                    first.chips += rest;
                    first.won += rest;
                }
            });
            const winners = contenders.filter((s) => s.won > 0);
            pk.results = winners.map((s) => t("pkResultWin", { name: s.name, n: s.won, hand: pkHandName(s.score) })).join(t("listComma"));
            winners.forEach((s) => log(t("pkLogWin", { who: s.name, n: s.won, hand: " (" + pkHandName(s.score) + ")" }), "pk-log"));
            const shows = contenders.map((s) => t("pkShows", { name: s.name, cards: pkCardsText(s.cards), hand: pkHandName(s.score) })).join(t("listComma"));
            const npcWinner = winners.find((s) => !s.human);
            pkHandOver(t("pkShowdownLine", { h: pk.hand, board: pkCardsText(pk.board), shows, results: pk.results }), npcWinner || null);
        }

        // The hand is over: who is out, and whether the game is.
        function pkHandOver(text, speaker) {
            pk.phase = "result";
            pk.fresh = null;
            const out = pk.seats.filter((s) => s.inHand && s.chips <= 0);
            out.forEach((s) => log(t("logOut", { who: s.name }), "pk-log"));
            if (out.length) {
                text += t("pkOut", { names: joinNames(out.map((s) => s.name)) });
            }
            const left = pk.seats.filter((s) => s.chips > 0);
            pk.over = left.length <= 1 || pk.hand >= pkHands;
            const npcs = pk.seats.filter((s) => !s.human);
            speaker = speaker || npcs.filter((s) => s.inHand).sort((a, b) => b.total - a.total)[0] || npcs[0];
            if (pk.over) {
                const top = Math.max(...pk.seats.map((s) => s.chips));
                pk.winners = pk.seats.flatMap((s, k) => (s.chips === top ? [k] : []));
                const champ = pk.winners.find((k) => k > 0);
                if (pk.winners.length > 1) {
                    speaker = pk.seats[champ];
                    text += t("pkEndTie", { names: joinNames(pk.winners.map(pkName)), chips: top, npc: speaker.name });
                } else if (pk.winners[0] === 0) {
                    text += t("pkEndPlayerWins", { player: playerName, chips: top, npc: speaker.name });
                } else {
                    speaker = pk.seats[champ];
                    text += t("pkEndNpcWins", { npc: speaker.name, chips: top });
                }
                log(t("stbLogEnd", { result: pkResult() }), "pk-log");
            }
            if (text) {
                say(speaker.id, text.trim(), pk.over);
            }
            reportPkState();
            pkStep();
        }

        function pkResult() {
            if (pk.winners.length > 1) {
                return t("stbTieResult", { names: joinNames(pk.winners.map(pkName)) });
            }
            return t("resultWin", { name: pkName(pk.winners[0]) });
        }

        // ---- the player's controls ----

        // Out of chips and no longer in the hand: the player only watches.
        const pkWatching = () => pk.seats[0].chips <= 0 && !(pk.phase === "bet" && pkInPlay(pk.seats[0]));
        const pkMine = () => pk.playing && !pk.over && pk.phase === "bet" && pk.turn === 0 && screen === "pk";

        function pkRaiseBounds() {
            const me = pk.seats[0];
            return { min: pkMinRaiseTo(me), max: pkMaxRaiseTo(me) };
        }

        function onPkFold() {
            if (pkMine() && pkToCall(pk.seats[0]) > 0) pkAct(0, "fold");
        }

        function onPkCall() {
            if (pkMine()) pkAct(0, pkToCall(pk.seats[0]) > 0 ? "call" : "check");
        }

        function onPkRaise() {
            if (pkMine() && pkCanRaise(pk.seats[0])) pkAct(0, "raise", pk.raiseTo);
        }

        function onPkAllIn() {
            if (!pkMine()) return;
            const me = pk.seats[0];
            if (pkCanRaise(me)) pkAct(0, "raise", pkMaxRaiseTo(me));
            else pkAct(0, "call");
        }

        function adjustPkRaise(d) {
            if (!pkMine()) return;
            const b = pkRaiseBounds();
            pk.raiseTo = Math.min(Math.max(pk.raiseTo + d * PK_BIG, b.min), b.max);
            renderPk();
        }

        function onPkNext() {
            if (pk.playing && !pk.over && pk.phase === "result" && pk.seats[0].chips > 0) pkStartHand();
        }

        function onPkLeave() {
            if (!pk.playing || pk.over) return;
            const watching = pkWatching();
            if (!pk.leaveArmed && !watching) {
                pk.leaveArmed = true;
                renderPk();
                return;
            }
            pk.gen++;
            pk.over = true;
            pk.left = true;
            pk.thinking = false;
            pk.leaveArmed = false;
            const first = pk.seats.find((s) => !s.human && s.chips > 0) || pk.seats[1];
            say(first.id, t(watching ? "pkStopWatching" : "pkLeave", { player: playerName }), true);
            log(t("logLeave", { player: playerName }), "pk-log");
            reportPkState();
            renderPk();
        }

        function onPkAgain() {
            newPkGame(pkOpponents());
        }

        // ---- what each NPC knows ----

        // Each NPC sees its own two cards and the table, never anyone else's cards.
        function pkStateFor(k) {
            const s = pk.seats[k];
            const vars = {
                npc: s.name, player: playerName, h: pk.hand, n: pkHands, chips: pkChipsLine(),
                others: joinNames(pk.seats.filter((x) => x !== s).map((x) => x.name)),
            };
            if (pk.over) {
                if (screen !== "pk") return "";
                return pk.left ? t("pkStateLeft", vars) : t("pkStateResult", { ...vars, result: pkResult() });
            }
            if (!pk.playing) return "";
            let text = t("pkState", vars);
            if (s.style && s.fromBio) {
                text += t("pkStateStyle", { npc: s.name, style: pkStyleLabel(s.style) });
            }
            if (!s.inHand) {
                text += t("pkStateOut", vars);
            } else if (s.folded) {
                text += t("pkStateFolded", vars);
            } else if (s.cards.length) {
                text += t("pkStateCards", { npc: s.name, cards: pkCardsText(s.cards) });
            }
            const table = { pot: pkPot(), bet: pk.currentBet };
            text += pk.board.length ? t("pkStateBoard", { ...table, board: pkCardsText(pk.board) }) : t("pkStateNoBoard", table);
            if (pk.phase === "result") {
                text += t("bjStateRound", { results: pk.results });
            } else if (pk.turn >= 0) {
                text += t("dStateTurn", { who: pkName(pk.turn) });
            }
            if (screen !== "pk") text += t("pkStatePaused");
            return text;
        }

        function reportPkState() {
            if (activeGame !== "pk") return;
            const states = {};
            pk.seats.forEach((s, k) => {
                if (!s.human) states[s.id] = pkStateFor(k);
            });
            send("rvState", JSON.stringify({ states, playing: pk.playing && !pk.over }));
        }

        // A game in progress is dropped (another game is starting).
        function abandonPk() {
            if (pk.playing && !pk.over) {
                pk.playing = false;
                pk.gen++;
                pk.thinking = false;
                voiceReset();
            }
        }

        const pkUnfinishedWith = (opps) => pk.playing && !pk.over &&
            pkOpponents().map((o) => o.id).join() === opps.map((o) => o.id).join();

        // Starts or resumes Texas Hold'em against opps ([{id, name}], one to three).
        function playPk(opps) {
            const same = pkUnfinishedWith(opps);
            if (!same) abandonPk();
            abandonDice();
            abandonStb();
            abandonBj();
            abandonReversi();
            activeGame = "pk";
            send("mgPlayers", opps.map((o) => o.id).join(","));
            if (same) {
                showScreen("pk");
                log(t("logResume"), "pk-log");
                reportPkState();
                pkStep();
                return;
            }
            snapFaces(opps.map((o) => o.id), () => {
                showScreen("pk");
                newPkGame(opps);
            });
        }

        // ---- rendering ----

        // A seat's cards: face down, or face up for the player and at the showdown.
        function pkFillCards(box, s, size) {
            box.innerHTML = "";
            if (!s.inHand || s.folded) return;
            const up = s.human || (pk.showdown && pkInPlay(s));
            s.cards.forEach((c) => box.appendChild(cardEl(c, size, !up)));
            if (up && pk.showdown && s.score) {
                const name = document.createElement("span");
                name.className = "hand-total";
                name.textContent = pkHandName(s.score);
                box.appendChild(name);
            }
        }

        function pkMetaText(s, k) {
            if (!s.inHand && pk.phase !== "result") return t("diceOut");
            if (s.chips <= 0 && pk.phase === "result" && !s.won) return t("diceOut");
            // once the hand is over, only the chips and what was won
            if (pk.phase === "result") {
                return t("bjChips", { chips: s.chips }) + (s.won ? " · +" + s.won : "");
            }
            const parts = [s.bet ? t("bjChipsBet", { chips: s.chips, bet: s.bet }) : t("bjChips", { chips: s.chips })];
            if (s.folded && s.inHand) parts.push(t("pkFolded"));
            else if (s.allIn) parts.push(t("pkAllInMark"));
            return parts.join(" · ");
        }

        function renderPk() {
            if (!pk.seats.length) return;
            const live = pk.playing && !pk.over;
            const seats = $("pk-seats");
            seats.innerHTML = "";
            pk.seats.forEach((s, k) => {
                if (s.human) return;
                const card = document.createElement("div");
                card.className = "seat" + (live && pk.phase === "bet" && pk.turn === k ? " active" : "") + (s.inHand && !s.folded ? "" : " out");
                const name = document.createElement("div");
                name.className = "seat-name";
                name.textContent = s.name + (k === pk.button ? " (" + t("pkDealer") + ")" : "");
                const style = document.createElement("div");
                style.className = "seat-meta";
                style.textContent = pkStyleLabel(s.style);
                const hand = document.createElement("div");
                hand.className = "hand small";
                pkFillCards(hand, s, "small");
                const meta = document.createElement("div");
                meta.className = "seat-meta";
                meta.textContent = pkMetaText(s, k);
                card.append(faceEl(s.id, s.name), name, style, hand, meta);
                seats.appendChild(card);
            });

            $("pk-label").textContent = t("pkHandLabel", { h: pk.hand, n: pkHands, pot: pkPot() });
            const board = $("pk-board");
            board.innerHTML = "";
            // all five places on the table, face down until their card is dealt
            pk.board.forEach((c) => board.appendChild(cardEl(c, "big", false)));
            for (let k = pk.board.length; k < 5; k++) {
                board.appendChild(cardEl(null, "big", true));
            }

            const me = pk.seats[0];
            $("pk-mine").classList.toggle("active", live && pk.phase === "bet" && pk.turn === 0);
            $("pk-mine-name").textContent = me.name + (pk.button === 0 ? " (" + t("pkDealer") + ")" : "");
            pkFillCards($("pk-mine-hand"), me, "mid");
            $("pk-mine-meta").textContent = pkMetaText(me, 0);

            // controls
            const mine = pkMine();
            $("pk-moves").style.display = mine ? "" : "none";
            $("pk-raise-row").style.display = mine && pkCanRaise(me) ? "" : "none";
            if (mine) {
                const toCall = pkToCall(me);
                const b = pkRaiseBounds();
                if (pk.raiseTo < b.min || pk.raiseTo > b.max) pk.raiseTo = b.min;
                $("pk-fold").disabled = toCall === 0;
                $("pk-call").textContent = toCall === 0 ? t("pkCheck") : t(toCall >= me.chips ? "pkCallAllIn" : "pkCall", { n: toCall });
                $("pk-raise").textContent = t(pk.currentBet === 0 ? "pkBet" : "pkRaise", { n: pk.raiseTo });
                $("pk-raise-down").disabled = pk.raiseTo <= b.min;
                $("pk-raise-up").disabled = pk.raiseTo >= b.max;
                $("pk-allin").textContent = t("pkAllIn", { n: me.bet + me.chips });
            }
            $("pk-next").style.display = live && pk.phase === "result" && me.chips > 0 ? "" : "none";
            $("pk-leave").style.display = live ? "" : "none";
            $("pk-leave").textContent = t(pkWatching() ? "stopWatching" : pk.leaveArmed ? "leaveConfirm" : "leave");
            $("pk-again").style.display = pk.over ? "" : "none";
            renderPkStatus();
        }

        function renderPkStatus() {
            if (!pk.seats.length) return;
            const lines = [];
            const me = pk.seats[0];
            if (pk.phase === "result" && pk.results) lines.push(pk.results);
            if (pk.over) {
                const top = pk.left ? 0 : pk.seats[pk.winners[0]].chips;
                if (pk.left) {
                    lines.length = 0;
                    lines.push(t("diceLeftStatus"));
                } else if (pk.winners.length > 1) {
                    lines.push(t("bjTieStatus", { names: joinNames(pk.winners.map(pkName)), chips: top }));
                } else if (pk.winners[0] === 0) {
                    lines.push(t("bjYouWin", { chips: top }));
                } else {
                    lines.push(t("bjNpcWins", { npc: pkName(pk.winners[0]), chips: top }));
                }
            } else if (pk.playing) {
                if (pkWatching()) lines.push(t("bjWatching"));
                if (pkMine()) {
                    const toCall = pkToCall(me);
                    lines.push(toCall > 0 ? t("pkYourTurn", { n: toCall }) : t("pkYourTurnFree"));
                } else if (pk.phase === "bet" && pk.turn !== 0) {
                    if (!pk.stylesReady) {
                        lines.push(t("pkReading"));
                    } else if (voiceLine && voiceLine.speaker !== PLAYER_ID) {
                        const speaker = pk.seats.find((x) => x.id === voiceLine.speaker);
                        lines.push(t("diceListening", { npc: speaker ? speaker.name : pkName(pk.turn) }));
                    } else if (pk.turn >= 0) {
                        lines.push(t("thinking", { npc: pkName(pk.turn) }));
                    }
                }
            }
            $("pk-status").textContent = lines.join("\n");
        }

        // ===== faces =====

        // A new game calls its opponents over (MCM) and takes a photo: the screen goes black
        // (mgGather), clears for the shot with the board out of the way (mgUncover), and each face
        // is cropped out of the photo (mgFaces). Without a face, the frame shows an initial.
        let gatherOn = true;
        let photoOn = true;       // MCM: without the photo, the frames show initials
        let faces = {};           // id -> {file, x, y, w, h}: the crop, as fractions of the photo
        let speaking = {};        // id -> until when (performance.now) the frame lights up
        let snapping = null;      // the photo being taken: {done}

        function snapFaces(ids, then) {
            if (!photoOn) {
                faces = {};
            }
            if (typeof window.mgGather !== "function" || (!photoOn && !gatherOn)) {
                then();           // a plain browser, or nothing to do first
                return;
            }
            const job = {
                done() {
                    if (snapping !== job) return;
                    snapping = null;
                    document.body.classList.remove("snapping");
                    $("curtain").classList.remove("on", "block");
                    then();
                },
            };
            snapping = job;
            $("curtain").classList.add("block");
            if (gatherOn) {
                $("curtain").classList.add("on");
            }
            setTimeout(() => send("mgGather", ids.join(",")), gatherOn ? 350 : 0);
            setTimeout(job.done, 6000);   // no answer: play on without faces
        }

        window.mgUncover = () => {
            document.body.classList.add("snapping");
            $("curtain").classList.remove("on");
        };

        window.mgFaces = (photo) => {
            for (const [id, crop] of Object.entries(photo.faces || {})) {
                faces[id] = { file: photo.file, ...crop };
            }
            if (snapping) {
                snapping.done();
            }
            document.querySelectorAll("[data-face]").forEach((el) => paintFace(el, el.dataset.face, el.dataset.name));
        };

        function paintFace(el, id, name) {
            const f = faces[id];
            el.dataset.name = name || "";
            el.classList.toggle("speaking", (speaking[id] || 0) > performance.now());
            if (!f) {
                el.style.backgroundImage = "";
                el.textContent = (name || "?").slice(0, 1);
                return;
            }
            el.textContent = "";
            el.style.backgroundImage = `url("${f.file}")`;
            el.style.backgroundSize = `${100 / f.w}% ${100 / f.h}%`;
            el.style.backgroundPosition = `${f.w < 1 ? (f.x / (1 - f.w)) * 100 : 0}% ${f.h < 1 ? (f.y / (1 - f.h)) * 100 : 0}%`;
        }

        function faceEl(id, name, cls = "") {
            const el = document.createElement("div");
            el.className = "face " + cls;
            el.dataset.face = id;
            paintFace(el, id, name);
            return el;
        }

        // id is talking for about ms: their frame lights up.
        function markSpeaking(id, ms) {
            speaking[id] = performance.now() + ms;
            const refresh = () => document.querySelectorAll("[data-face]").forEach((el) =>
                el.classList.toggle("speaking", (speaking[el.dataset.face] || 0) > performance.now()));
            refresh();
            setTimeout(refresh, ms + 50);
        }

        // ===== screens =====

        // "menu", "board" (Reversi), "dice", "stb", "bj", "pk", or null when the plugin has hidden the view. A
        // game counts as hidden (paused) whenever its screen is not up.
        let screen = null;
        let activeGame = null;    // "reversi" | "dice" | "stb" | "bj" | "pk": the game whose state the NPCs see

        function showScreen(name) {
            screen = name;
            $("menu").classList.toggle("open", name === "menu");
            $("panel").classList.toggle("open", name === "board");
            $("dice").classList.toggle("open", name === "dice");
            $("stb").classList.toggle("open", name === "stb");
            $("bj").classList.toggle("open", name === "bj");
            $("pk").classList.toggle("open", name === "pk");
            hidden = name !== "board";
            fitPanels();
        }

        // Everything is drawn this much larger, unless the open panel would not fit the screen.
        const UI_ZOOM = 1.5;

        function fitPanels() {
            for (const el of document.querySelectorAll(".panel.open")) {
                el.style.zoom = 1;
                const fit = Math.min((window.innerWidth * 0.96) / el.offsetWidth, (window.innerHeight * 0.96) / el.offsetHeight);
                el.style.zoom = Math.min(UI_ZOOM, fit);
            }
        }

        window.addEventListener("resize", fitPanels);

        // The prompts of whoever plays the active game, for the plugin.
        function reportActive() {
            if (activeGame === "reversi") {
                reportState();
            } else if (activeGame === "dice") {
                reportDiceState();
            } else if (activeGame === "stb") {
                reportStbState();
            } else if (activeGame === "bj") {
                reportBjState();
            } else if (activeGame === "pk") {
                reportPkState();
            }
        }

        // A Reversi game in progress is dropped (another game is starting).
        function abandonReversi() {
            if (playing && !over) {
                playing = false;
            }
        }

        // Starts or resumes Reversi against opp ({id, name}); invite: opp challenged the player.
        function playReversi(opp, invite) {
            abandonDice();
            abandonStb();
            abandonBj();
            abandonPk();
            activeGame = "reversi";
            const sameOpponent = opp.id === opponent.id;
            if (!sameOpponent && playing && !over) {
                // a game with someone else is left behind (reported while the plugin still has
                // the old opponent, so their busy state and prompt are cleared)
                playing = false;
                reportState();
            }
            opponent = opp;
            send("mgPlayers", opp.id);
            showScreen("board");
            renderPlayers();

            if (invite) {
                showInvite(true);
                render();
                return;
            }
            showInvite(false);
            if (sameOpponent && playing && !over) {
                // carry on where the game was left
                log(t("logResume"));
                reportState();
                render();
                nextTurn();
                return;
            }
            snapFaces([opp.id], newGame);
        }

        // ===== menu =====

        // The games on offer. opponents: how many NPCs may sit at the table.
        const GAMES = [
            { id: "reversi", title: "gameReversi", desc: "gameReversiDesc", opponents: 1, start: (chosen) => playReversi(chosen[0], false) },
            { id: "dice", title: "gameDice", desc: "gameDiceDesc", opponents: 3, start: (chosen) => playDice(chosen) },
            { id: "stb", title: "gameStb", desc: "gameStbDesc", opponents: 3, start: (chosen) => playStb(chosen) },
            { id: "bj", title: "gameBj", desc: "gameBjDesc", opponents: 3, start: (chosen) => {
                if (bjUnfinishedWith(chosen)) {
                    playBj(chosen);
                } else {
                    chooseDealer(chosen, (dealer) => playBj(chosen, dealer));
                }
            } },
            { id: "pk", title: "gamePk", desc: "gamePkDesc", opponents: 3, start: (chosen) => playPk(chosen) },
        ];

        let actors = [];          // nearby NPCs from the plugin: {id, name, distance, crosshair}
        let menuGame = null;      // the game being set up
        let menuChosen = [];      // ids of the chosen opponents, in the order picked

        function showMenu() {
            showScreen("menu");
            $("step-game").classList.add("open");
            $("step-opponents").classList.remove("open");
            $("step-dealer").classList.remove("open");
            menuGame = null;

            const list = $("game-list");
            list.innerHTML = "";
            // the unfinished game first
            if (activeGame === "reversi" && playing && !over) {
                list.appendChild(menuRow(t("resume", { game: t("gameReversi"), npc: opponent.name }), "", "", () => playReversi(opponent, false), "resume"));
            } else if (activeGame === "dice" && dice.playing && !dice.over) {
                const opps = diceOpponents();
                list.appendChild(menuRow(t("resume", { game: t("gameDice"), npc: joinNames(opps.map((o) => o.name)) }), "", "", () => playDice(opps), "resume"));
            } else if (activeGame === "stb" && stb.playing && !stb.over) {
                const opps = stbOpponents();
                list.appendChild(menuRow(t("resume", { game: t("gameStb"), npc: joinNames(opps.map((o) => o.name)) }), "", "", () => playStb(opps), "resume"));
            } else if (activeGame === "bj" && bj.playing && !bj.over) {
                const opps = bjOpponents();
                list.appendChild(menuRow(t("resume", { game: t("gameBj"), npc: joinNames(opps.map((o) => o.name)) }), "", "", () => playBj(opps), "resume"));
            } else if (activeGame === "pk" && pk.playing && !pk.over) {
                const opps = pkOpponents();
                list.appendChild(menuRow(t("resume", { game: t("gamePk"), npc: joinNames(opps.map((o) => o.name)) }), "", "", () => playPk(opps), "resume"));
            }
            for (const game of GAMES) {
                list.appendChild(menuRow(t(game.title), t(game.desc), "", () => chooseOpponents(game)));
            }
            fitPanels();
        }

        function menuRow(title, sub, meta, onClick, extraClass = "") {
            const row = document.createElement("div");
            row.className = "row " + extraClass;
            const text = document.createElement("span");
            text.className = "title";
            text.textContent = title;
            if (sub) {
                const small = document.createElement("span");
                small.className = "sub";
                small.textContent = sub;
                text.appendChild(small);
            }
            row.appendChild(text);
            if (meta) {
                const right = document.createElement("span");
                right.className = "meta";
                right.textContent = meta;
                row.appendChild(right);
            }
            row.onclick = onClick;
            return row;
        }

        // keep: coming back to the list, with the picks as they were.
        function chooseOpponents(game, keep = false) {
            menuGame = game;
            if (!keep) {
                // the one in sight is picked to begin with
                const inSight = actors.find((a) => a.crosshair);
                menuChosen = inSight ? [inSight.id] : [];
            }
            $("step-game").classList.remove("open");
            $("step-dealer").classList.remove("open");
            $("step-opponents").classList.add("open");
            $("opponents-heading").textContent = game.opponents > 1 ? t("chooseOpponents", { n: game.opponents }) : t("chooseOpponent");
            renderActors();
            fitPanels();
        }

        function renderActors() {
            const list = $("actor-list");
            list.innerHTML = "";
            if (!actors.length) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = t("noActors");
                list.appendChild(empty);
            }
            for (const actor of actors) {
                const meta = (actor.crosshair ? t("inSight") + " · " : "") + t("distance", { m: actor.distance });
                const row = menuRow(actor.name, "", meta, () => toggleActor(actor.id), menuChosen.includes(actor.id) ? "selected" : "");
                row.ondblclick = () => {
                    if (menuGame.opponents === 1) {
                        menuChosen = [actor.id];
                        menuStart();
                    }
                };
                list.appendChild(row);
            }
            $("menu-start").disabled = menuChosen.length === 0;
        }

        function toggleActor(id) {
            const index = menuChosen.indexOf(id);
            if (index >= 0) {
                menuChosen.splice(index, 1);
            } else if (menuGame.opponents === 1) {
                menuChosen = [id];
            } else if (menuChosen.length < menuGame.opponents) {
                menuChosen.push(id);
            }
            renderActors();
        }

        // Blackjack: who deals, the player or one of the opponents. then(seat): 0 is the player.
        function chooseDealer(opps, then) {
            showScreen("menu");
            $("step-game").classList.remove("open");
            $("step-opponents").classList.remove("open");
            $("step-dealer").classList.add("open");
            const list = $("dealer-list");
            list.innerHTML = "";
            list.appendChild(menuRow(t("dealerYou", { name: playerName }), "", "", () => then(0)));
            opps.forEach((o, k) => list.appendChild(menuRow(o.name, "", "", () => then(k + 1))));
            fitPanels();
        }

        function menuBack() {
            if ($("step-dealer").classList.contains("open") && menuGame) {
                chooseOpponents(menuGame, true);
            } else {
                showMenu();
            }
        }

        function menuStart() {
            const chosen = menuChosen.map((id) => actors.find((a) => a.id === id)).filter(Boolean);
            if (!menuGame || !chosen.length) {
                return;
            }
            menuGame.start(chosen.map((a) => ({ id: a.id, name: a.name })));
        }

        // ===== called from the plugin =====

        // Options every open carries: { player, level, hints, color, diceLevel, stbLevel, bjLevel, bjRounds, pkLevel, pkHands, voice, voiceWait, strings }.
        function applyOptions(opts) {
            applyStrings(opts.strings);
            playerName = opts.player || playerName;
            level = opts.level || level;
            showHints = opts.hints !== false;
            colorSetting = opts.color || colorSetting;
            diceLevel = opts.diceLevel || diceLevel;
            stbLevel = opts.stbLevel || stbLevel;
            bjLevel = opts.bjLevel || bjLevel;
            bjRounds = opts.bjRounds || bjRounds;
            pkLevel = opts.pkLevel || pkLevel;
            pkHands = opts.pkHands || pkHands;
            voiceOn = !!opts.voice;
            playerVoice = !!opts.playerVoice;
            gatherOn = opts.gather !== false;
            photoOn = opts.facePhoto !== false;
            voiceWait = opts.voiceWait || voiceWait;
        }

        // The hotkey: the menu, with the NPCs nearby (opts.actors, nearest first).
        window.mgOpen = (opts) => {
            applyOptions(opts);
            actors = opts.actors || [];
            showMenu();
        };

        // An NPC challenged the player to Reversi: opts.opponent {id, name}.
        window.rvOpen = (opts) => {
            applyOptions(opts);
            playReversi(opts.opponent, true);
        };

        // The plugin hid the view (Esc, the hotkey). A game in progress waits for the next open.
        window.rvHidden = () => {
            showScreen(null);
            if ($("invite").classList.contains("open")) {
                showInvite(false);
                narrate(t("ignored", { npc: opponent.name, player: playerName }), "important");
            }
            reportActive();
        };

        // Someone at the table said a line ({id, text}). If it is the line being waited for, the
        // table goes on once it has had about the time to be said.
        window.mgSpoke = (spoke) => {
            if (spoke && spoke.id) {
                markSpeaking(spoke.id, speechMs(spoke.text));
            }
            if (!voiceLine || voiceLine.heard || !spoke || spoke.id !== voiceLine.speaker) {
                return;
            }
            voiceLine.heard = true;
            clearTimeout(voiceLine.timer);
            voiceLine.timer = setTimeout(lineDone, speechMs(spoke.text));
        };

        // A save was loaded: the game on the board belongs to another timeline.
        window.rvReset = () => {
            playing = false;
            over = false;
            thinking = false;
            opponent = { id: "", name: t("opponentDefault") };
            showInvite(false);
            $("log").innerHTML = "";
            setStatus("");
            abandonDice();
            dice.seats = [];
            dice.over = false;
            abandonStb();
            stb.seats = [];
            stb.over = false;
            abandonBj();
            bj.seats = [];
            bj.over = false;
            abandonPk();
            pk.seats = [];
            pk.over = false;
            activeGame = null;
            voiceReset();
        };

        // Esc steps back or closes. It comes as a key press, from the plugin (mgEscape), or both:
        // a second one right after the first is the same press.
        let lastEscape = 0;
        function onEscape() {
            if (Date.now() - lastEscape < 300) {
                return;
            }
            lastEscape = Date.now();
            if ($("invite").classList.contains("open")) {
                onDecline();
            } else if (($("step-opponents").classList.contains("open") || $("step-dealer").classList.contains("open")) && $("menu").classList.contains("open")) {
                menuBack();
            } else {
                requestClose();
            }
        }
        window.mgEscape = onEscape;

        document.addEventListener("keydown", (e) => {
            if ((e.key === "Escape" || e.key === "Esc" || e.keyCode === 27) && !e.isComposing) {
                onEscape();
            }
        });

        buildBoard();
        applyStrings();
        render();
    </script>
</body>
</html>
