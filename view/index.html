                ...opps.map((o) => ({ id: o.id, name: o.name, human: false, tiles: ALL_TILES, score: null })),
            ];
            stb.turn = Math.floor(Math.random() * stb.seats.length);
            stb.phase = "roll";
            stb.dice = [];
            stb.rolling = false;
            stb.picked = 0;
            stb.lastShut = 0;
            stb.closeNoted = false;
            stb.playing = true;
            stb.over = false;
            stb.left = false;
            stb.shutBy = -1;
            stb.winners = [];
            stb.thinking = false;
            stb.leaveArmed = false;
            $("stb-log").innerHTML = "";
            $("stb-meta").textContent = t("strength", { level: t("level" + (stbLevel >= 1 && stbLevel <= 4 ? stbLevel : 2)) });
            const order = stb.seats.map((s, k) => stbName((stb.turn + k) % stb.seats.length));
            log(t("stbLogStart", { order: order.join(t("listComma")) }), "stb-log");
            say(opps[0].id, t("sStart", { player: playerName, npcs: joinNames(opps.map((o) => o.name)) }));
            reportStbState();
            stbStep();
        }

        // The seat playing moves: the player through the board, an NPC once the table is quiet.
        function stbStep() {
            renderStb();
            if (!stb.playing || stb.over || stb.rolling || stb.thinking || stb.phase === "done" || stb.seats[stb.turn].human) {
                return;
            }
            stb.thinking = true;
            const gen = stb.gen, seat = stb.turn;
            renderStbStatus();
            whenQuiet(() => {
                if (gen !== stb.gen) {
                    return;
                }
                if (screen !== "stb") {
                    // carried on when the table is back on screen
                    stb.thinking = false;
                    return;
                }
                renderStbStatus();
                setTimeout(() => {
                    if (gen !== stb.gen) {
                        return;
                    }
                    stb.thinking = false;
                    if (screen !== "stb") {
                        return;
                    }
                    if (stb.phase === "roll") {
                        stbRoll();
                    } else {
                        stbShut(seat, stbChoose(seat, stbRollTotal()));
                    }
                }, 700 + Math.random() * 600);
            });
        }

        // The dice tumble for a moment, then the roll stands.
        function stbRoll() {
            const gen = stb.gen, seat = stb.turn;
            const count = stbDiceCount(stb.seats[seat].tiles);
            const throwDice = () => Array.from({ length: count }, () => 1 + Math.floor(Math.random() * 6));
            stb.rolling = true;
            stb.lastShut = 0;
            stb.dice = throwDice();
            renderStb();
            const tumble = setInterval(() => {
                if (gen !== stb.gen) {
                    clearInterval(tumble);
                    return;
                }
                stb.dice = throwDice();
                renderStbDice();
            }, 90);
            setTimeout(() => {
                clearInterval(tumble);
                if (gen !== stb.gen) {
                    return;
                }
                stb.rolling = false;
                stb.dice = throwDice();
                const n = stbRollTotal();
                if (!shutOptions(stb.seats[seat].tiles, n).length) {
                    stbTurnOver(seat, n);
                    return;
                }
                stb.phase = "shut";
                stb.picked = 0;
                reportStbState();
                stbStep();
            }, 650);
        }

        // Seat i shuts these tiles for the roll.
        function stbShut(i, mask) {
            const s = stb.seats[i];
            log(t("stbLogShut", { who: s.name, n: stbRollTotal(), tiles: tilesText(mask) }), "stb-log");
            s.tiles &= ~mask;
            stb.lastShut = mask;
            stb.picked = 0;
            stb.phase = "roll";
            stb.leaveArmed = false;
            if (!s.tiles) {
                stbShutBox(i);
                return;
            }
            if (tileSum(s.tiles) <= 6 && !stb.closeNoted) {
                stb.closeNoted = true;
                const speaker = s.human ? stbNextToSpeak(i) : s.id;
                say(speaker, t("sClose", { who: s.name, tiles: tilesText(s.tiles) }));
            }
            reportStbState();
            stbStep();
        }

        // An NPC to voice what happened to seat i: the next to play, or else the first one in.
        function stbNextToSpeak(i) {
            for (let k = 1; k <= stb.seats.length; k++) {
                const s = stb.seats[(i + k) % stb.seats.length];
                if (!s.human && s.score === null) {
                    return s.id;
                }
            }
            return stb.seats.find((s) => !s.human).id;
        }

        // Every tile is down: seat i wins at once.
        function stbShutBox(i) {
            const s = stb.seats[i];
            s.score = 0;
            stb.shutBy = i;
            stb.winners = [i];
            stb.over = true;
            log(t("stbLogShutBox", { who: s.name }), "stb-log");
            log(t("stbLogEnd", { result: stbResult() }), "stb-log");
            const speaker = s.human ? stb.seats[1] : s;
            say(speaker.id, t(s.human ? "sShutPlayer" : "sShutNpc", { npc: speaker.name, player: playerName }), true);
            reportStbState();
            renderStb();
        }

        // Seat i's roll of n cannot be made: the open tiles are its score.
        function stbTurnOver(i, n) {
            const s = stb.seats[i];
            s.score = tileSum(s.tiles);
            stb.phase = "done";
            stb.leaveArmed = false;
            log(t("stbLogNoMove", { who: s.name, n, score: s.score }), "stb-log");

            const next = stbNextSeat(i);
            let text = t("sTurnEnd", { who: s.name, n, tiles: tilesText(s.tiles), score: s.score });
            let speaker = s.human ? stbNextToSpeak(i) : s.id;
            let keep = false;

            if (next < 0) {
                const low = Math.min(...stb.seats.map((x) => x.score));
                stb.winners = stb.seats.flatMap((x, k) => (x.score === low ? [k] : []));
                stb.over = true;
                const names = joinNames(stb.winners.map(stbName));
                const champ = stb.winners.find((k) => k > 0);
                if (stb.winners.length > 1) {
                    speaker = stb.seats[champ].id;
                    text += t("sEndTie", { names, score: low, npc: stbName(champ) });
                } else if (stb.winners[0] === 0) {
                    const loser = stb.seats.find((x) => !x.human);
                    speaker = loser.id;
                    text += t("sEndPlayerWins", { player: playerName, npc: loser.name, score: low });
                } else {
                    speaker = stb.seats[champ].id;
                    text += t("sEndNpcWins", { npc: stbName(champ), score: low });
                }
                keep = true;
                log(t("stbLogEnd", { result: stbResult() }), "stb-log");
            } else {
                const played = stb.seats.filter((x) => x.score !== null);
                if (played.length > 1) {
                    const best = played.reduce((a, x) => (x.score < a.score ? x : a));
                    text += t("sBest", { who: best.name, score: best.score });
                }
                text += t("sNext", { who: stbName(next) });
            }
            say(speaker, text, keep);
            reportStbState();
            renderStb();

            if (next >= 0) {
                // a moment to see how the turn ended
                const gen = stb.gen;
                setTimeout(() => {
                    if (gen !== stb.gen) {
                        return;
                    }
                    stb.turn = next;
                    stb.phase = "roll";
                    stb.dice = [];
                    stb.lastShut = 0;
                    stb.closeNoted = false;
                    reportStbState();
                    stbStep();
                }, 1800);
            }
        }

        // The seat after i that has yet to play, or -1.
        function stbNextSeat(i) {
            for (let k = 1; k < stb.seats.length; k++) {
                const j = (i + k) % stb.seats.length;
                if (stb.seats[j].score === null) {
                    return j;
                }
            }
            return -1;
        }

        // How the finished game ended, in a few words.
        function stbResult() {
            if (stb.winners.length > 1) {
                return t("stbTieResult", { names: joinNames(stb.winners.map(stbName)) });
            }
            return t("resultWin", { name: stbName(stb.winners[0]) });
        }

        // ---- the player's moves ----

        function onStbRoll() {
            if (stbPlayerActs() && stb.phase === "roll") {
                stbRoll();
            }
        }

        // A tile that can go towards the roll toggles; once the picked tiles make the roll, they shut.
        function onStbTile(bit) {
            if (!stbPlayerActs() || stb.phase !== "shut") {
                return;
            }
            if (stb.picked & bit) {
                stb.picked &= ~bit;
            } else if (stbCanPick(bit)) {
                stb.picked |= bit;
            } else {
                return;
            }
            if (tileSum(stb.picked) === stbRollTotal()) {
                stbShut(0, stb.picked);
            } else {
                renderStb();
            }
        }

        // Whether some way of making the roll has this tile along with those already picked.
        function stbCanPick(bit) {
            const want = stb.picked | bit;
            return shutOptions(stb.seats[0].tiles, stbRollTotal()).some((m) => (m & want) === want);
        }

        function onStbLeave() {
            if (!stb.playing || stb.over) {
                return;
            }
            if (!stb.leaveArmed) {
                stb.leaveArmed = true;
                renderStb();
                return;
            }
            stb.gen++;
            stb.over = true;
            stb.left = true;
            stb.rolling = false;
            stb.thinking = false;
            stb.leaveArmed = false;
            say(stb.seats[1].id, t("sLeave", { player: playerName }), true);
            log(t("logLeave", { player: playerName }), "stb-log");
            reportStbState();
            renderStb();
        }

        function onStbAgain() {
            newStbGame(stbOpponents());
        }

        // ---- what each NPC knows ----

        function stbStateFor(k) {
            const s = stb.seats[k];
            const vars = {
                npc: s.name, player: playerName,
                others: joinNames(stb.seats.filter((x) => x !== s).map((x) => x.name)),
            };
            if (stb.over) {
                if (screen !== "stb") {
                    return "";
                }
                return stb.left ? t("sStateLeft", vars) : t("sStateResult", { ...vars, result: stbResult() });
            }
            if (!stb.playing) {
                return "";
            }
            let text = t("sState", vars);
            const played = stb.seats.filter((x) => x.score !== null);
            if (played.length) {
                text += t("sStateScores", { scores: played.map((x) => t("diceCount", { name: x.name, n: x.score })).join(t("listComma")) });
            }
            if (stb.phase !== "done") {
                const now = stb.seats[stb.turn];
                text += t("sStateTurn", { who: now.name, tiles: tilesText(now.tiles) });
                if (stb.phase === "shut") {
                    text += t("sStateRolled", { who: now.name, n: stbRollTotal() });
                }
            }
            if (screen !== "stb") {
                text += t("sStatePaused");
            }
            return text;
        }

        function reportStbState() {
            if (activeGame !== "stb") {
                return;
            }
            const states = {};
            stb.seats.forEach((s, k) => {
                if (!s.human) {
                    states[s.id] = stbStateFor(k);
                }
            });
            send("rvState", JSON.stringify({ states, playing: stb.playing && !stb.over }));
        }

        // A game in progress is dropped (another game is starting).
        function abandonStb() {
            if (stb.playing && !stb.over) {
                stb.playing = false;
                stb.gen++;
                stb.rolling = false;
                stb.thinking = false;
                voiceReset();
            }
        }

        // Starts or resumes Shut the Box against opps ([{id, name}], one to three).
        function playStb(opps) {
            const same = stb.playing && !stb.over &&
                stbOpponents().map((o) => o.id).join() === opps.map((o) => o.id).join();
            if (!same) {
                abandonStb();
            }
            abandonDice();
            abandonReversi();
            abandonBj();
            abandonPk();
            activeGame = "stb";
            abandonCheckersAndCribbage();
            send("mgPlayers", opps.map((o) => o.id).join(","));
            if (same) {
                showScreen("stb");
                log(t("logResume"), "stb-log");
                reportStbState();
                stbStep();
                return;
            }
            snapFaces(opps.map((o) => o.id), () => {
                showScreen("stb");
                newStbGame(opps);
            });
        }

        // ---- rendering ----

        function stbTileEls(box, open, onClick) {
            box.innerHTML = "";
            for (let n = 1; n <= 9; n++) {
                const bit = 1 << (n - 1);
                const el = document.createElement("div");
                el.className = "tile" + (open & bit ? "" : " shut") + (stb.lastShut & bit ? " fold" : "");
                el.textContent = n;
                if (onClick) {
                    onClick(el, bit);
                }
                box.appendChild(el);
            }
        }

        function stbMetaText(s, k) {
            if (s.score !== null) {
                return t("stbScore", { score: s.score });
            }
            return t(k === stb.turn && !stb.over ? "stbPlaying" : "stbWaiting");
        }

        function renderStb() {
            if (!stb.seats.length) {
                return;
            }
            const live = stb.playing && !stb.over;
            const seats = $("stb-seats");
            seats.innerHTML = "";
            stb.seats.forEach((s, k) => {
                if (s.human) {
                    return;
                }
                const card = document.createElement("div");
                card.className = "seat" + (live && stb.turn === k ? " active" : "");
                const name = document.createElement("div");
                name.className = "seat-name";
                name.textContent = s.name;
                const tiles = document.createElement("div");
                tiles.className = "tiles mini";
                stbTileEls(tiles, s.tiles);
                const meta = document.createElement("div");
                meta.className = "seat-meta";
                meta.textContent = stbMetaText(s, k);
                card.append(faceEl(s.id, s.name), name, tiles, meta);
                seats.appendChild(card);
            });

            const me = stb.seats[0];
            $("stb-mine").classList.toggle("active", live && stb.turn === 0);
            $("stb-mine-name").textContent = me.name;
            stbTileEls($("stb-mine-tiles"), me.tiles);
            $("stb-mine-meta").textContent = stbMetaText(me, 0);

            // the tiles in the middle are those of whoever is playing, or the winner's at the end
            const shown = stb.over && stb.winners.length ? stb.winners[0] : stb.turn;
            const choosing = stbPlayerActs() && stb.phase === "shut";
            $("stb-label").textContent = t("stbTilesOf", { who: stbName(shown) });
            stbTileEls($("stb-tiles"), stb.seats[shown].tiles, choosing ? (el, bit) => {
                if (!(stb.seats[0].tiles & bit)) {
                    return;
                }
                if (stb.picked & bit) {
                    el.classList.add("picked");
                } else if (stbCanPick(bit)) {
                    el.classList.add("can");
                }
                el.onclick = () => onStbTile(bit);
            } : null);

            renderStbDice();
            $("stb-roll-button").style.display = live && stb.turn === 0 && stb.phase === "roll" && !stb.rolling ? "" : "none";
            $("stb-roll-button").disabled = !stbPlayerActs();
            $("stb-leave").style.display = live ? "" : "none";
            $("stb-leave").textContent = t(stb.leaveArmed ? "leaveConfirm" : "leave");
            $("stb-again").style.display = stb.over ? "" : "none";
            renderStbStatus();
        }

        function renderStbDice() {
            const box = $("stb-dice");
            box.innerHTML = "";
            for (const d of stb.dice) {
                box.appendChild(dieEl(d, "big" + (stb.rolling ? " rolling" : "")));
            }
            if (stb.dice.length && !stb.rolling) {
                const sum = document.createElement("span");
                sum.textContent = "= " + stbRollTotal();
                box.appendChild(sum);
            }
        }

        function renderStbStatus() {
            if (!stb.seats.length) {
                return;
            }
            const lines = [];
            if (stb.over) {
                const low = stb.left ? 0 : stb.seats[stb.winners[0]].score;
                if (stb.left) {
                    lines.push(t("diceLeftStatus"));
                } else if (stb.shutBy >= 0) {
                    lines.push(t("stbShutStatus", { who: stbName(stb.shutBy) }));
                } else if (stb.winners.length > 1) {
                    lines.push(t("stbTieStatus", { names: joinNames(stb.winners.map(stbName)), score: low }));
                } else if (stb.winners[0] === 0) {
                    lines.push(t("stbYouWin", { score: low }));
                } else {
                    lines.push(t("stbNpcWins", { npc: stbName(stb.winners[0]), score: low }));
                }
            } else if (stb.playing) {
                const s = stb.seats[stb.turn];
                if (stb.phase === "done") {
                    lines.push(t("stbNoMove", { who: s.name, n: stbRollTotal(), score: s.score }));
                } else if (s.human) {
                    if (!stb.rolling) {
                        lines.push(stb.phase === "roll" ? t("stbYourRoll") : t("stbYourShut", { n: stbRollTotal() }));
                    }
                } else if (voiceLine && voiceLine.speaker !== PLAYER_ID) {
                    const speaker = stb.seats.find((x) => x.id === voiceLine.speaker);
                    lines.push(t("diceListening", { npc: speaker ? speaker.name : s.name }));
                } else {
                    lines.push(t("thinking", { npc: s.name }));
                }
            }
            $("stb-status").textContent = lines.join("\n");
        }

        // ===== Blackjack =====

        const BJ_CHIPS = 100;
        const BJ_BETS = [10, 20, 50];
        const SUITS = ["♠", "♥", "♦", "♣"];
        const RANK_MARKS = { 1: "A", 11: "J", 12: "Q", 13: "K" };
        const rankMark = (r) => RANK_MARKS[r] || String(r);
        const cardPoints = (c) => (c.r === 1 ? 11 : Math.min(c.r, 10));

        // {total, soft}: soft while an ace still counts as 11.
        function handValue(cards) {
            let total = 0, aces = 0;
            for (const c of cards) {
                total += cardPoints(c);
                if (c.r === 1) aces++;
            }
            while (total > 21 && aces > 0) {
                total -= 10;
                aces--;
            }
            return { total, soft: aces > 0 };
        }

        const isNatural = (cards) => cards.length === 2 && handValue(cards).total === 21;

        function newDeck() {
            const deck = [];
            for (let s = 0; s < 4; s++) {
                for (let r = 1; r <= 13; r++) {
                    deck.push({ r, s });
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        // ---- opponent AI ----

        // What a player does against the dealer's face-up card: "hit", "stand" or "double".
        // 1: stands on a feeling. 2: mostly by the book, doubling only on 11. 3, 4: by the book.
        function bjPlayerMove(cards, upCard, level, canDouble) {
            const { total, soft } = handValue(cards);
            const up = cardPoints(upCard);
            if (total >= 21) {
                return "stand";
            }
            if (level <= 1) {
                return total <= 14 || (total <= 16 && Math.random() < 0.5) ? "hit" : "stand";
            }
            let move;
            if (soft) {
                move = total >= 19 || (total === 18 && up <= 8) ? "stand" : "hit";
            } else if (total >= 17) {
                move = "stand";
            } else if (total >= 13) {
                move = up <= 6 ? "stand" : "hit";
            } else if (total === 12) {
                move = up >= 4 && up <= 6 ? "stand" : "hit";
            } else {
                move = "hit";
            }
            if (level === 2 && total >= 12 && total <= 16 && Math.random() < 0.15) {
                move = move === "hit" ? "stand" : "hit";
            }
            if (canDouble && !soft) {
                const doubles = level === 2 ? total === 11 :
                    total === 11 ? up <= 10 : total === 10 ? up <= 9 : total === 9 && up >= 3 && up <= 6;
                if (doubles) {
                    return "double";
                }
            }
            return move;
        }

        // What the dealer's total wins (+) or loses (-) against these hands: [{total, bet}].
        function bjStake(total, hands) {
            return hands.reduce((sum, h) => sum + (total > 21 || total < h.total ? -h.bet : total > h.total ? h.bet : 0), 0);
        }

        // The most the dealer can expect from these cards, drawing from what is left unseen.
        function bjBestValue(cards, hands, counts, left) {
            const { total } = handValue(cards);
            const stand = bjStake(total, hands);
            if (total >= 21) {
                return stand;
            }
            let draw = 0;
            for (let r = 1; r <= 13; r++) {
                if (counts[r]) {
                    const p = counts[r] / left;
                    counts[r]--;
                    draw += p * bjBestValue([...cards, { r, s: 0 }], hands, counts, left - 1);
                    counts[r]++;
                }
            }
            return total <= 16 ? draw : Math.max(stand, draw);
        }

        // Whether the dealer draws. On 16 or less they must; on 17 or more it is their choice.
        // 1: stands. 2: draws on a soft 17. 3: draws when standing would lose more than it wins.
        // 4: works out from the cards still unseen whether drawing pays.
        function bjDealerDraws(cards, hands, unseen, level) {
            const { total, soft } = handValue(cards);
            if (total <= 16) {
                return true;
            }
            if (total >= 21 || level <= 1) {
                return false;
            }
            if (level === 2) {
                return total === 17 && soft;
            }
            if (bjStake(total, hands) >= 0) {
                return false;
            }
            if (level === 3) {
                return total < 20;
            }
            const counts = {};
            unseen.forEach((c) => {
                counts[c.r] = (counts[c.r] || 0) + 1;
            });
            let draw = 0;
            for (let r = 1; r <= 13; r++) {
                if (counts[r]) {
                    const p = counts[r] / unseen.length;
                    counts[r]--;
                    draw += p * bjBestValue([...cards, { r, s: 0 }], hands, counts, unseen.length - 1);
                    counts[r]++;
                }
            }
            return draw > bjStake(total, hands);
        }

        // An NPC's bet. Stronger ones bet up when they are behind with few rounds left.
        function bjNpcBet(chips, leader, roundsLeft, level) {
            let bet = BJ_BETS[Math.floor(Math.random() * 2)];
            if (level >= 3 && chips < leader && roundsLeft <= 2) {
                bet = 50;
            }
            return Math.min(bet, chips);
        }

        // ---- flow ----

        let bjLevel = 2;
        let bjRounds = 5;

        const bj = {
            gen: 0,          // bumped when a game is left or dropped: its pending steps stop
            seats: [],       // seat 0 is the player: {id, name, human, chips, bet, cards, inRound, natural, bust, delta}
            round: 0,
            dealer: 0,       // the seat dealing this round
            turn: 0,         // the seat to act
            phase: "bet",    // bet | act | dealer | result
            deck: [],
            house: 0,        // what the dealer, who holds no chips, has won or lost over the game
            revealed: false, // the dealer's face-down card is up
            fresh: null,     // the card just drawn
            playing: false,
            over: false,
            left: false,     // the player left before the end
            winners: [],
            results: "",     // how the last round went, in words
            thinking: false, // an NPC's move is on its way
            leaveArmed: false,
        };

        const bjName = (i) => bj.seats[i].name;
        // Still at the table: the dealer always, the others while they have chips.
        const bjIn = (k) => k === bj.dealer || bj.seats[k].chips > 0;
        const bjProfit = () => (bj.house > 0 ? "+" : "") + bj.house;
        const bjOpponents = () => bj.seats.filter((s) => !s.human).map((s) => ({ id: s.id, name: s.name }));
        const bjChipsLine = () => bj.seats.filter((s, k) => k !== bj.dealer).map((s) => t(s.chips > 0 ? "diceCount" : "diceCountOut", { name: s.name, n: s.chips })).join(t("listComma"));
        const bjCardsText = (cards) => cards.map((c) => (RANK_MARKS[c.r] ? t("bjRank" + RANK_MARKS[c.r]) : String(c.r))).join(t("listComma"));
        // What is known of a hand: "soft 17", "bust", "blackjack", or the total.
        function bjTotalText(s) {
            if (s.natural) return t("bjBlackjack");
            const { total, soft } = handValue(s.cards);
            if (total > 21) return t("bjBustMark");
            return soft ? t("bjSoft", { n: total }) : String(total);
        }

        // Whose turn it is to answer for what happened to seat i: them, or else the dealer or
        // the first NPC still in.
        function bjSpeaker(i) {
            if (!bj.seats[i].human) return bj.seats[i].id;
            if (!bj.seats[bj.dealer].human) return bj.seats[bj.dealer].id;
            const s = bj.seats.find((x) => !x.human && x.inRound) || bj.seats[1];
            return s.id;
        }

        // dealer: the seat that deals until the game ends (0 is the player).
        function newBjGame(opps, dealer) {
            bj.gen++;
            bj.dealer = dealer;
            bj.seats = [
                { id: "", name: playerName, human: true, chips: BJ_CHIPS, bet: 0, cards: [], inRound: false, natural: false, bust: false, delta: null },
                ...opps.map((o) => ({ id: o.id, name: o.name, human: false, chips: BJ_CHIPS, bet: 0, cards: [], inRound: false, natural: false, bust: false, delta: null })),
            ];
            bj.seats[dealer].chips = 0;
            bj.house = 0;
            bj.round = 0;
            bj.playing = true;
            bj.over = false;
            bj.left = false;
            bj.winners = [];
            bj.results = "";
            bj.thinking = false;
            bj.leaveArmed = false;
            $("bj-log").innerHTML = "";
            $("bj-meta").textContent = t("strength", { level: t("level" + (bjLevel >= 1 && bjLevel <= 4 ? bjLevel : 2)) });
            say(opps[0].id, t("bjStart", { player: playerName, npcs: joinNames(opps.map((o) => o.name)), n: bjRounds, chips: BJ_CHIPS, dealer: bjName(dealer) }));
            bjStartRound();
        }

        // The NPCs bet, then it is up to the player.
        function bjStartRound() {
            bj.round++;
            bj.phase = "bet";
            bj.revealed = false;
            bj.fresh = null;
            bj.results = "";
            bj.leaveArmed = false;
            bj.deck = newDeck();
            bj.seats.forEach((s, k) => {
                s.bet = 0;
                s.cards = [];
                s.inRound = bjIn(k);
                s.natural = false;
                s.bust = false;
                s.delta = null;
            });
            bj.turn = bj.dealer;
            log(t("bjLogRound", { r: bj.round, n: bjRounds, who: bjName(bj.dealer) }), "bj-log");
            const leader = Math.max(...bj.seats.map((s) => s.chips));
            bj.seats.forEach((s, k) => {
                if (!s.human && s.inRound && k !== bj.dealer) {
                    s.bet = bjNpcBet(s.chips, leader, bjRounds - bj.round, bjLevel);
                    log(t("bjLogBet", { who: s.name, n: s.bet }), "bj-log");
                }
            });
            reportBjState();
            bjStep();
        }

        // Two cards each. A dealer's blackjack ends the round at once.
        function bjDeal() {
            for (let pass = 0; pass < 2; pass++) {
                for (let k = 1; k <= bj.seats.length; k++) {
                    const s = bj.seats[(bj.dealer + k) % bj.seats.length];
                    if (s.inRound) {
                        s.cards.push(bj.deck.pop());
                    }
                }
            }
            bj.seats.forEach((s) => {
                s.natural = s.inRound && isNatural(s.cards);
                if (s.natural) {
                    log(t("bjLogNatural", { who: s.name }), "bj-log");
                }
            });
            const d = bj.seats[bj.dealer];
            if (d.natural) {
                bj.revealed = true;
                bjSettle();
                return;
            }
            const hands = bj.seats
                .filter((s, k) => s.inRound && k !== bj.dealer)
                .map((s) => t(s.natural ? "bjHandNatural" : "bjHand", { name: s.name, cards: bjCardsText(s.cards), total: bjTotalText(s) }));
            const speaker = d.human ? bj.seats.find((s) => !s.human && s.inRound) : d;
            say(speaker.id, t("bjRoundLine", { r: bj.round, n: bjRounds, dealer: d.name, up: bjCardsText([d.cards[0]]), hands: hands.join(t("listComma")) }));
            bjAdvance();
        }

        // On to the next seat that has a move, the dealer last.
        function bjAdvance() {
            bj.phase = "act";
            let k = bj.turn;
            for (;;) {
                k = (k + 1) % bj.seats.length;
                if (k === bj.dealer) {
                    bjDealerTurn();
                    return;
                }
                const s = bj.seats[k];
                if (s.inRound && !s.natural) {
                    bj.turn = k;
                    reportBjState();
                    bjStep();
                    return;
                }
            }
        }

        // The hands the dealer still has to beat.
        const bjLiveHands = () => bj.seats
            .filter((s, k) => s.inRound && k !== bj.dealer && !s.bust && !s.natural)
            .map((s) => ({ total: handValue(s.cards).total, bet: s.bet }));

        function bjDealerTurn() {
            bj.phase = "dealer";
            bj.turn = bj.dealer;
            bj.revealed = true;
            const d = bj.seats[bj.dealer];
            log(t("bjLogReveal", { who: d.name, cards: bjCardsText(d.cards), total: bjTotalText(d) }), "bj-log");
            if (!bjLiveHands().length || handValue(d.cards).total >= 21) {
                bjSettle();
                return;
            }
            reportBjState();
            bjStep();
        }

        // The seat to act moves: the player through the controls, an NPC once the table is quiet.
        function bjStep() {
            renderBj();
            if (!bj.playing || bj.over || bj.thinking) {
                return;
            }
            const me = bj.seats[0];
            const mine = bj.phase === "bet" || bj.phase === "result" ? bjIn(0) : bj.turn === 0;
            if (mine) {
                return;
            }
            bj.thinking = true;
            const gen = bj.gen;
            renderBjStatus();
            whenQuiet(() => {
                if (gen !== bj.gen) {
                    return;
                }
                if (screen !== "bj") {
                    // carried on when the table is back on screen
                    bj.thinking = false;
                    return;
                }
                renderBjStatus();
                setTimeout(() => {
                    if (gen !== bj.gen) {
                        return;
                    }
                    bj.thinking = false;
                    if (screen === "bj") {
                        bjAuto();
                    }
                }, bj.phase === "result" ? 2500 : 800 + Math.random() * 700);
            });
        }

        // What happens next without the player.
        function bjAuto() {
            if (bj.phase === "bet") {
                bjDeal();
            } else if (bj.phase === "result") {
                bjStartRound();
            } else if (bj.phase === "dealer") {
                const d = bj.seats[bj.dealer];
                if (bjDealerDraws(d.cards, bjLiveHands(), bj.deck, bjLevel)) {
                    bjHit(bj.dealer);
                } else {
                    bjStand(bj.dealer);
                }
            } else {
                const s = bj.seats[bj.turn];
                const canDouble = s.cards.length === 2 && s.chips >= s.bet * 2;
                const move = bjPlayerMove(s.cards, bj.seats[bj.dealer].cards[0], bjLevel, canDouble);
                if (move === "double") {
                    bjDouble(bj.turn);
                } else if (move === "hit") {
                    bjHit(bj.turn);
                } else {
                    bjStand(bj.turn);
                }
            }
        }

        function bjDraw(i) {
            const c = bj.deck.pop();
            bj.seats[i].cards.push(c);
            bj.fresh = c;
            return c;
        }

        function bjHit(i) {
            const s = bj.seats[i];
            const c = bjDraw(i);
            const { total } = handValue(s.cards);
            log(t("bjLogHit", { who: s.name, card: bjCardsText([c]), total: bjTotalText(s) }), "bj-log");
            bj.leaveArmed = false;
            if (total > 21) {
                s.bust = true;
                if (i !== bj.dealer) {
                    say(bjSpeaker(i), t("bjBust", { who: s.name, card: bjCardsText([c]), total }));
                }
            }
            bjAfterMove(i, total >= 21);
        }

        function bjStand(i) {
            const s = bj.seats[i];
            log(t("bjLogStand", { who: s.name, total: bjTotalText(s) }), "bj-log");
            bj.leaveArmed = false;
            bjAfterMove(i, true);
        }

        // Twice the bet for one more card.
        function bjDouble(i) {
            const s = bj.seats[i];
            s.bet *= 2;
            const c = bjDraw(i);
            const { total } = handValue(s.cards);
            log(t("bjLogDouble", { who: s.name, card: bjCardsText([c]), total: bjTotalText(s), bet: s.bet }), "bj-log");
            bj.leaveArmed = false;
            s.bust = total > 21;
            say(bjSpeaker(i), t(s.bust ? "bjDoubleBust" : "bjDoubleLine", { who: s.name, card: bjCardsText([c]), total, bet: s.bet }));
            bjAfterMove(i, true);
        }

        function bjAfterMove(i, finished) {
            if (!finished) {
                reportBjState();
                bjStep();
            } else if (i === bj.dealer) {
                bjSettle();
            } else {
                bjAdvance();
            }
        }

        // The dealer pays or collects from each hand, out of no chips of their own: the house
        // always pays, and only the running total changes.
        function bjSettle() {
            const d = bj.seats[bj.dealer];
            const dTotal = handValue(d.cards).total;
            const dBust = dTotal > 21;
            const words = [];
            d.delta = 0;
            bj.seats.forEach((s, k) => {
                if (!s.inRound || k === bj.dealer) {
                    return;
                }
                const total = handValue(s.cards).total;
                let delta;
                if (s.bust) {
                    delta = -s.bet;
                } else if (s.natural) {
                    delta = d.natural ? 0 : s.bet * 1.5;
                } else if (d.natural) {
                    delta = -s.bet;
                } else {
                    delta = dBust || total > dTotal ? s.bet : total < dTotal ? -s.bet : 0;
                }
                s.delta = delta;
                s.chips += delta;
                d.delta -= delta;
                words.push(t(delta > 0 ? "bjResultWin" : delta < 0 ? "bjResultLose" : "bjResultPush", { name: s.name, n: Math.abs(delta) }));
            });
            bj.house += d.delta;
            bj.phase = "result";
            bj.turn = bj.dealer;
            bj.results = words.join(t("listComma"));
            bj.fresh = null;
            bj.leaveArmed = false;
            log(t("bjLogResult", { results: bj.results }), "bj-log");

            // out of chips: a player is out, and the game goes on until no player is left
            const out = bj.seats.filter((s) => s !== d && s.inRound && s.chips <= 0);
            out.forEach((s) => log(t("logOut", { who: s.name }), "bj-log"));
            const playersLeft = bj.seats.some((s) => s !== d && s.chips > 0);
            bj.over = bj.round >= bjRounds || !playersLeft;

            let text = t("bjRoundEnd", { r: bj.round, dealer: d.name, hand: bjTotalText(d), results: bj.results, chips: bjChipsLine() });
            if (out.length) {
                text += t("bjOut", { names: joinNames(out.map((s) => s.name)) });
            }
            let speaker = d.human ? null : d;
            if (!speaker) {
                const npcs = bj.seats.filter((s) => !s.human && s.inRound);
                speaker = npcs.reduce((a, s) => (Math.abs(s.delta) > Math.abs(a.delta) ? s : a));
            }
            if (bj.over) {
                // the most chips among the players; if none has any, the dealer has beaten them all
                const top = Math.max(...bj.seats.map((s) => s.chips));
                bj.winners = !playersLeft ? [bj.dealer] : bj.seats.flatMap((s, k) => (s !== d && s.chips === top ? [k] : []));
                const champ = bj.winners.find((k) => k > 0);
                if (!playersLeft) {
                    text += t("bjEndHouse", { dealer: d.name });
                } else if (bj.winners.length > 1) {
                    speaker = bj.seats[champ];
                    text += t("bjEndTie", { names: joinNames(bj.winners.map(bjName)), chips: top, npc: speaker.name });
                } else if (bj.winners[0] === 0) {
                    text += t("bjEndPlayerWins", { player: playerName, chips: top, npc: speaker.name });
                } else {
                    speaker = bj.seats[champ];
                    text += t("bjEndNpcWins", { npc: speaker.name, chips: top });
                }
                text += t("bjHouseNote", { dealer: d.name, profit: bjProfit() });
                log(t("stbLogEnd", { result: bjResult() }), "bj-log");
            }
            say(speaker.id, text, bj.over);
            reportBjState();
            bjStep();
        }

        // How the finished game ended, in a few words.
        function bjResult() {
            if (bj.winners.length > 1) {
                return t("stbTieResult", { names: joinNames(bj.winners.map(bjName)) });
            }
            return t("resultWin", { name: bjName(bj.winners[0]) });
        }

        // ---- the player's controls ----

        const bjMyMove = () => bj.playing && !bj.over && bj.turn === 0 && (bj.phase === "act" || bj.phase === "dealer") && screen === "bj";
        const bjMyDouble = () => bjMyMove() && bj.phase === "act" && bj.seats[0].cards.length === 2 && bj.seats[0].chips >= bj.seats[0].bet * 2;
        const bjMyBet = () => bj.playing && !bj.over && bj.phase === "bet" && bj.dealer !== 0 && bj.seats[0].chips > 0 && screen === "bj";
        const bjMyDeal = () => bj.playing && !bj.over && bj.phase === "bet" && bj.dealer === 0 && screen === "bj";
        // The dealer must draw on 16 or less.
        const bjMustDraw = () => bj.phase === "dealer" && handValue(bj.seats[0].cards).total <= 16;

        function onBjBet(n) {
            if (bjMyBet()) {
                bj.seats[0].bet = n;
                log(t("bjLogBet", { who: playerName, n }), "bj-log");
                bjDeal();
            }
        }

        function onBjDeal() {
            if (bjMyDeal()) {
                bjDeal();
            }
        }

        function onBjHit() {
            if (bjMyMove()) {
                bjHit(0);
            }
        }

        function onBjStand() {
            if (bjMyMove() && !bjMustDraw()) {
                bjStand(0);
            }
        }

        function onBjDouble() {
            if (bjMyDouble()) {
                bjDouble(0);
            }
        }

        function onBjNext() {
            if (bj.playing && !bj.over && bj.phase === "result" && bjIn(0)) {
                bjStartRound();
            }
        }

        function onBjLeave() {
            if (!bj.playing || bj.over) {
                return;
            }
            // once out, the player has nothing to lose: no second press
            const watching = !bjIn(0);
            if (!bj.leaveArmed && !watching) {
                bj.leaveArmed = true;
                renderBj();
                return;
            }
            bj.gen++;
            bj.over = true;
            bj.left = true;
            bj.thinking = false;
            bj.leaveArmed = false;
            const first = bj.seats.find((s, k) => !s.human && bjIn(k)) || bj.seats[1];
            say(first.id, t(watching ? "bjStopWatching" : "bjLeave", { player: playerName }), true);
            log(t("logLeave", { player: playerName }), "bj-log");
            reportBjState();
            renderBj();
        }

        // Who deals the next game is chosen anew.
        function onBjAgain() {
            const opps = bjOpponents();
            menuGame = null;
            chooseDealer(opps, (dealer) => {
                showScreen("bj");
                newBjGame(opps, dealer);
            });
        }

        // ---- what each NPC knows ----

        // Everyone's cards lie face up but the dealer's second, which only the dealer has seen.
        function bjStateFor(k) {
            const s = bj.seats[k];
            const vars = {
                npc: s.name, player: playerName, r: bj.round, n: bjRounds, chips: bjChipsLine(),
                others: joinNames(bj.seats.filter((x) => x !== s).map((x) => x.name)),
            };
            if (bj.over) {
                if (screen !== "bj") {
                    return "";
                }
                return bj.left ? t("bjStateLeft", vars) : t("bjStateResult", { ...vars, result: bjResult() });
            }
            if (!bj.playing) {
                return "";
            }
            let text = t("bjState", vars) + t("bjStateDealer", { dealer: bjName(bj.dealer) });
            const d = bj.seats[bj.dealer];
            if (d.cards.length) {
                const shown = bj.revealed ? d.cards : [d.cards[0]];
                const hands = bj.seats
                    .filter((x, j) => x.inRound && j !== bj.dealer)
                    .map((x) => t("bjHand", { name: x.name, cards: bjCardsText(x.cards), total: bjTotalText(x) }));
                text += t("bjStateTable", { dealer: d.name, up: bjCardsText(shown), hands: hands.join(t("listComma")) });
                if (k === bj.dealer && !bj.revealed) {
                    text += t("bjStateHole", { npc: s.name, hole: bjCardsText([d.cards[1]]) });
                }
            }
            if (bj.phase === "act" || bj.phase === "dealer") {
                text += t("dStateTurn", { who: bjName(bj.turn) });
            } else if (bj.phase === "result") {
                text += t("bjStateRound", { results: bj.results });
            }
            if (screen !== "bj") {
                text += t("bjStatePaused");
            }
            return text;
        }

        function reportBjState() {
            if (activeGame !== "bj") {
                return;
            }
            const states = {};
            bj.seats.forEach((s, k) => {
                if (!s.human) {
                    states[s.id] = bjStateFor(k);
                }
            });
            send("rvState", JSON.stringify({ states, playing: bj.playing && !bj.over }));
        }

        // A game in progress is dropped (another game is starting).
        function abandonBj() {
            if (bj.playing && !bj.over) {
                bj.playing = false;
                bj.gen++;
                bj.thinking = false;
                voiceReset();
            }
        }

        const bjUnfinishedWith = (opps) => bj.playing && !bj.over &&
            bjOpponents().map((o) => o.id).join() === opps.map((o) => o.id).join();

        // Starts Blackjack against opps ([{id, name}], one to three) with this seat dealing, or
        // resumes the unfinished game against them.
        function playBj(opps, dealer) {
            const same = bjUnfinishedWith(opps);
            if (!same) {
                abandonBj();
            }
            abandonDice();
            abandonStb();
            abandonReversi();
            abandonPk();
            activeGame = "bj";
            abandonCheckersAndCribbage();
            send("mgPlayers", opps.map((o) => o.id).join(","));
            if (same) {
                showScreen("bj");
                log(t("logResume"), "bj-log");
                reportBjState();
                bjStep();
                return;
            }
            snapFaces(opps.map((o) => o.id), () => {
                showScreen("bj");
                newBjGame(opps, dealer);
            });
        }

        // ---- rendering ----

        function cardEl(c, size, faceDown) {
            const el = document.createElement("div");
            el.className = "card " + size + (faceDown ? " back" : "") + (!faceDown && c === bj.fresh ? " new" : "");
            if (!faceDown) {
                el.classList.toggle("red", c.s === 1 || c.s === 2);
                const rank = document.createElement("span");
                rank.textContent = rankMark(c.r);
                const suit = document.createElement("span");
                suit.className = "suit";
                suit.textContent = SUITS[c.s];
                el.append(rank, suit);
            }
            return el;
        }

        // A hand and what it is worth, as far as the player may know.
        function fillHand(box, s, k, size) {
            box.innerHTML = "";
            box.classList.toggle("many", s.cards.length > 4);
            const hideHole = k === bj.dealer && k !== 0 && !bj.revealed;
            s.cards.forEach((c, j) => box.appendChild(cardEl(c, size, hideHole && j === 1)));
            if (s.cards.length) {
                const total = document.createElement("span");
                total.className = "hand-total";
                total.textContent = hideHole ? "?" : bjTotalText(s);
                box.appendChild(total);
            }
        }

        function bjMetaText(s, k) {
            if (!bjIn(k) && !(bj.phase === "result" && s.inRound)) {
                return t("diceOut");
            }
            let text = k === bj.dealer ? t("bjDealerBadge", { profit: bjProfit() }) :
                s.bet ? t("bjChipsBet", { chips: s.chips, bet: s.bet }) : t("bjChips", { chips: s.chips });
            if (s.delta !== null && bj.phase === "result") {
                text += ` (${s.delta > 0 ? "+" : ""}${s.delta})`;
            }
            return text;
        }

        function renderBj() {
            if (!bj.seats.length) {
                return;
            }
            const live = bj.playing && !bj.over;
            const acting = live && (bj.phase === "act" || bj.phase === "dealer");
            const seats = $("bj-seats");
            seats.innerHTML = "";
            bj.seats.forEach((s, k) => {
                if (s.human) {
                    return;
                }
                const card = document.createElement("div");
                card.className = "seat" + (acting && bj.turn === k ? " active" : "") + (k === bj.dealer ? " dealer" : "") + (bjIn(k) || (bj.phase === "result" && s.inRound) ? "" : " out");
                const name = document.createElement("div");
                name.className = "seat-name";
                name.textContent = s.name;
                const hand = document.createElement("div");
                hand.className = "hand small";
                if (k !== bj.dealer) {
                    fillHand(hand, s, k, "small");
                }
                const meta = document.createElement("div");
                meta.className = "seat-meta";
                meta.textContent = bjMetaText(s, k);
                card.append(faceEl(s.id, s.name), name, hand, meta);
                seats.appendChild(card);
            });

            const d = bj.seats[bj.dealer];
            $("bj-label").textContent = t("bjRoundLabel", { r: bj.round, n: bjRounds, who: d.name });
            fillHand($("bj-dealer-hand"), d, bj.dealer, "big");

            const me = bj.seats[0];
            $("bj-mine").classList.toggle("active", acting && bj.turn === 0);
            $("bj-mine").classList.toggle("dealer", bj.dealer === 0);
            $("bj-mine-name").textContent = me.name;
            const hand = $("bj-mine-hand");
            if (bj.dealer === 0) {
                hand.innerHTML = "";
            } else {
                fillHand(hand, me, 0, "mid");
            }
            $("bj-mine-meta").textContent = bjMetaText(me, 0);

            // controls
            const bets = $("bj-bets");
            bets.innerHTML = "";
            bets.style.display = bjMyBet() ? "" : "none";
            if (bjMyBet()) {
                const options = me.chips < BJ_BETS[0] ? [me.chips] : BJ_BETS.filter((n) => n <= me.chips);
                for (const n of options) {
                    const b = document.createElement("button");
                    b.className = "primary";
                    b.textContent = t("bjBetButton", { n });
                    b.onclick = () => onBjBet(n);
                    bets.appendChild(b);
                }
            }
            $("bj-deal").style.display = bjMyDeal() ? "" : "none";
            $("bj-moves").style.display = bjMyMove() ? "" : "none";
            $("bj-stand").disabled = bjMyMove() && bjMustDraw();
            $("bj-double").style.display = bj.phase === "act" ? "" : "none";
            $("bj-double").disabled = !bjMyDouble();
            $("bj-next").style.display = live && bj.phase === "result" && bjIn(0) ? "" : "none";
            $("bj-leave").style.display = live ? "" : "none";
            $("bj-leave").textContent = t(!bjIn(0) ? "stopWatching" : bj.leaveArmed ? "leaveConfirm" : "leave");
            $("bj-again").style.display = bj.over ? "" : "none";
            renderBjStatus();
        }

        function renderBjStatus() {
            if (!bj.seats.length) {
                return;
            }
            const lines = [];
            const me = bj.seats[0];
            if (bj.phase === "result" && bj.results) {
                lines.push(bj.results);
            }
            if (bj.over) {
                const top = bj.left ? 0 : bj.seats[bj.winners[0]].chips;
                if (bj.left) {
                    lines.length = 0;
                    lines.push(t("diceLeftStatus"));
                } else if (bj.winners[0] === bj.dealer) {
                    lines.push(t("bjHouseWins", { dealer: bjName(bj.dealer) }));
                } else if (bj.winners.length > 1) {
                    lines.push(t("bjTieStatus", { names: joinNames(bj.winners.map(bjName)), chips: top }));
                } else if (bj.winners[0] === 0) {
                    lines.push(t("bjYouWin", { chips: top }));
                } else {
                    lines.push(t("bjNpcWins", { npc: bjName(bj.winners[0]), chips: top }));
                }
                if (!bj.left) {
                    lines.push(t("bjHouseStatus", { dealer: bjName(bj.dealer), profit: bjProfit() }));
                }
            } else if (bj.playing) {
                if (!bjIn(0)) {
                    lines.push(t("bjWatching"));
                }
                if (bjMyBet()) {
                    lines.push(t("bjBetPrompt", { dealer: bjName(bj.dealer) }));
                } else if (bjMyDeal()) {
                    lines.push(t("bjDealPrompt"));
                } else if (bjMyMove()) {
                    if (bj.phase === "act") {
                        lines.push(t("bjYourTurn", { total: bjTotalText(me) }));
                    } else {
                        lines.push(t(bjMustDraw() ? "bjYourDealerMust" : "bjYourDealerFree", { total: bjTotalText(me) }));
                    }
                } else if (bj.phase !== "result" && bj.turn !== 0) {
                    if (voiceLine && voiceLine.speaker !== PLAYER_ID) {
                        const speaker = bj.seats.find((x) => x.id === voiceLine.speaker);
                        lines.push(t("diceListening", { npc: speaker ? speaker.name : bjName(bj.turn) }));
                    } else {
                        lines.push(t("thinking", { npc: bjName(bj.turn) }));
                    }
                }
            }
            $("bj-status").textContent = lines.join("\n");
        }

        // ===== Texas Hold'em =====

        const PK_CHIPS = 200;
        const PK_SMALL = 5, PK_BIG = 10;
        const pkValue = (c) => (c.r === 1 ? 14 : c.r);

        // ---- hands ----

        // A five-card hand as a number that sorts with the hands: the category, then the ranks
        // that break ties (pairs before kickers).
        function pkScore5(cards) {
            const vals = cards.map(pkValue).sort((a, b) => b - a);
            const flush = cards.every((c) => c.s === cards[0].s);
            const counts = {};
            vals.forEach((v) => { counts[v] = (counts[v] || 0) + 1; });
            const groups = Object.keys(counts).map(Number).sort((a, b) => counts[b] - counts[a] || b - a);
            const uniq = [...new Set(vals)];
            let straightTop = 0;
            if (uniq.length === 5) {
                if (uniq[0] - uniq[4] === 4) {
                    straightTop = uniq[0];
                } else if (uniq[0] === 14 && uniq[1] === 5) {
                    straightTop = 5;   // A-2-3-4-5
                }
            }
            let cat, ranks;
            if (straightTop && flush) { cat = 8; ranks = [straightTop]; }
            else if (counts[groups[0]] === 4) { cat = 7; ranks = groups; }
            else if (counts[groups[0]] === 3 && counts[groups[1]] === 2) { cat = 6; ranks = groups; }
            else if (flush) { cat = 5; ranks = vals; }
            else if (straightTop) { cat = 4; ranks = [straightTop]; }
            else if (counts[groups[0]] === 3) { cat = 3; ranks = groups; }
            else if (counts[groups[0]] === 2 && counts[groups[1]] === 2) { cat = 2; ranks = groups; }
            else if (counts[groups[0]] === 2) { cat = 1; ranks = groups; }
            else { cat = 0; ranks = vals; }
            let score = cat;
            for (let k = 0; k < 5; k++) {
                score = score * 15 + (ranks[k] || 0);
            }
            return score;
        }

        // The ways to pick five of n cards, as index lists.
        const PK_PICKS = {};
        function pkPicks(n) {
            if (!PK_PICKS[n]) {
                const out = [];
                const pick = (start, chosen) => {
                    if (chosen.length === 5) {
                        out.push(chosen.slice());
                        return;
                    }
                    for (let k = start; k < n; k++) {
                        chosen.push(k);
                        pick(k + 1, chosen);
                        chosen.pop();
                    }
                };
                pick(0, []);
                PK_PICKS[n] = out;
            }
            return PK_PICKS[n];
        }

        // The best five of five to seven cards.
        function pkBest(cards) {
            let best = 0;
            for (const p of pkPicks(cards.length)) {
                const score = pkScore5(p.map((k) => cards[k]));
                if (score > best) best = score;
            }
            return best;
        }

        const PK_TOP = Math.pow(15, 5);
        function pkHandName(score) {
            const cat = Math.floor(score / PK_TOP);
            if (cat === 8 && Math.floor(score / Math.pow(15, 4)) % 15 === 14) {
                return t("pkHandRoyal");
            }
            return t("pkHand" + cat);
        }

        // How often these two cards win against this many unknown hands, from a few hundred
        // deals of the cards still unseen (a tie counts for its share).
        function pkEquity(hole, board, opponents, sims, unseen) {
            let won = 0;
            for (let s = 0; s < sims; s++) {
                const d = unseen.slice();
                let n = d.length;
                const draw = () => {
                    const j = Math.floor(Math.random() * n);
                    const c = d[j];
                    d[j] = d[--n];
                    return c;
                };
                const full = board.slice();
                while (full.length < 5) full.push(draw());
                const mine = pkBest([...hole, ...full]);
                let ties = 0, beaten = false;
                for (let o = 0; o < opponents && !beaten; o++) {
                    const theirs = pkBest([draw(), draw(), ...full]);
                    if (theirs > mine) beaten = true;
                    else if (theirs === mine) ties++;
                }
                if (!beaten) won += 1 / (ties + 1);
            }
            return won / sims;
        }

        // ---- opponent AI ----

        // How an NPC plays, read from their character when the game starts (mgStyle).
        const PK_LOOSE = { tight: 0, normal: 0.5, loose: 1 };
        const PK_BOLD = { cautious: 0, normal: 0.5, bold: 1 };
        const PK_BLUFF = { rarely: 0.03, sometimes: 0.1, often: 0.22 };
        const PK_DEFAULT_STYLE = { hands: "normal", bets: "normal", bluff: "sometimes" };
        // The skill (MCM): how many deals it tries, how blurry its sums are, how much it weighs
        // the pot odds, and whether it reads the others' ways of playing.
        const PK_LEVELS = {
            1: { sims: 120, noise: 0.16, odds: 0.3, read: false },
            2: { sims: 250, noise: 0.08, odds: 0.7, read: false },
            3: { sims: 400, noise: 0.04, odds: 1, read: false },
            4: { sims: 700, noise: 0.02, odds: 1, read: true },
        };
        let pkLevel = 2;
        let pkHands = 10;

        const pkRound5 = (n) => Math.max(PK_BIG, Math.round(n / 5) * 5);
        const pkPot = () => pk.seats.reduce((n, s) => n + s.total, 0);
        const pkInPlay = (s) => s.inHand && !s.folded;
        const pkCanAct = (s) => s.inHand && !s.folded && !s.allIn;
        const pkToCall = (s) => Math.min(pk.currentBet - s.bet, s.chips);
        // The least a raise may go to, and the most (everything).
        const pkMinRaiseTo = (s) => Math.min(pk.currentBet + pk.minRaise, s.bet + s.chips);
        const pkMaxRaiseTo = (s) => s.bet + s.chips;
        const pkCanRaise = (s) => s.chips > pkToCall(s);

        // A bet or raise of about a share of the pot, bigger for a strong hand or a bold player.
        function pkRaiseSize(s, eq, bold) {
            if (eq > 0.85 && bold > 0.6 && Math.random() < 0.3) {
                return pkMaxRaiseTo(s);
            }
            const size = pkRound5((pkPot() + pkToCall(s)) * (0.5 + 0.5 * bold) * (eq > 0.75 ? 1.3 : 1));
            return Math.min(Math.max(pk.currentBet + size, pkMinRaiseTo(s)), pkMaxRaiseTo(s));
        }

        // {act: "fold" | "check" | "call" | "raise", to}
        function pkDecide(i) {
            const s = pk.seats[i];
            const cfg = PK_LEVELS[pkLevel] || PK_LEVELS[2];
            const style = s.style || PK_DEFAULT_STYLE;
            const loose = PK_LOOSE[style.hands] ?? 0.5;
            const bold = PK_BOLD[style.bets] ?? 0.5;
            const bluff = PK_BLUFF[style.bluff] ?? 0.1;
            const rivals = pk.seats.filter((x, k) => k !== i && pkInPlay(x)).length;
            const known = new Set([...s.cards, ...pk.board]);
            const unseen = pk.allCards.filter((c) => !known.has(c));
            let eq = pkEquity(s.cards, pk.board, rivals, cfg.sims, unseen) + (Math.random() * 2 - 1) * cfg.noise;
            if (cfg.read && pk.lastRaiser >= 0 && pk.lastRaiser !== i) {
                // a raise means more from a choosy player, less from one who bluffs a lot
                const r = pk.seats[pk.lastRaiser].style || PK_DEFAULT_STYLE;
                eq += (r.hands === "tight" ? -0.06 : r.hands === "loose" ? 0.03 : 0) + (r.bluff === "often" ? 0.04 : 0);
            }
            const toCall = pkToCall(s);
            const fair = 1 / (rivals + 1);
            const odds = toCall > 0 ? toCall / (pkPot() + toCall) : 0;
            // what a call needs: the pot odds (as well as this player weighs them), a little more
            // before the flop for a choosy player, a little less for a loose one
            const need = cfg.odds * odds + (1 - cfg.odds) * fair * 0.9 +
                (pk.street === 0 ? fair * (0.25 - 0.4 * loose) : 0) + 0.04 - 0.1 * loose;
            const strong = fair * (1.45 - 0.35 * bold) + 0.05;
            if (pkCanRaise(s) && eq > strong && Math.random() < 0.35 + 0.55 * bold) {
                return { act: "raise", to: pkRaiseSize(s, eq, bold) };
            }
            // a bluff: mostly into a quiet pot, more often once the cards are out
            if (pkCanRaise(s) && toCall <= PK_BIG && Math.random() < bluff * (pk.street > 0 ? 1.2 : 0.6)) {
                return { act: "raise", to: pkRaiseSize(s, 0.6, bold) };
            }
            if (toCall === 0) {
                return { act: "check" };
            }
            return eq >= need ? { act: "call" } : { act: "fold" };
        }

        // ---- flow ----

        const pk = {
            gen: 0,          // bumped when a game is left or dropped: its pending steps stop
            seats: [],       // seat 0 is the player: {id, name, human, chips, cards, bet, total, inHand, folded, allIn, acted, style, fromBio, won, score}
            hand: 0,
            button: 0,       // the seat dealing this hand
            board: [],
            deck: [],
            allCards: [],    // this hand's whole deck, for the AI's sums
            street: 0,       // 0 before the flop, 1 flop, 2 turn, 3 river
            phase: "bet",    // bet | result
            turn: 0,
            currentBet: 0,   // the bet to match this street
            minRaise: PK_BIG,
            lastRaiser: -1,
            showdown: false, // the cards of those still in are up
            results: "",
            playing: false,
            over: false,
            left: false,
            winners: [],
            thinking: false,
            leaveArmed: false,
            raiseTo: 0,      // the player's raise being set up
            stylesReady: true,
            fresh: null,
        };

        const pkName = (i) => pk.seats[i].name;
        const pkOpponents = () => pk.seats.filter((s) => !s.human).map((s) => ({ id: s.id, name: s.name }));
        const pkChipsLine = () => pk.seats.map((s) => t(s.chips > 0 ? "diceCount" : "diceCountOut", { name: s.name, n: s.chips })).join(t("listComma"));
        const pkCardName = (c) => t("pkCardName", { rank: RANK_MARKS[c.r] ? t("bjRank" + RANK_MARKS[c.r]) : String(c.r), suit: t("pkSuit" + c.s) });
        const pkCardsText = (cards) => cards.map(pkCardName).join(t("listComma"));

        // The seat after k that passes a test, or -1.
        function pkNext(k, test) {
            for (let j = 1; j <= pk.seats.length; j++) {
                const n = (k + j) % pk.seats.length;
                if (test(pk.seats[n])) return n;
            }
            return -1;
        }

        // The label for an NPC's way of playing: only what is not middling.
        function pkStyleLabel(style) {
            if (!style) return t("pkStyleReading");
            const parts = [];
            if (style.bets === "bold") parts.push(t("pkStyleBold"));
            if (style.bets === "cautious") parts.push(t("pkStyleCautious"));
            if (style.hands === "tight") parts.push(t("pkStyleTight"));
            if (style.hands === "loose") parts.push(t("pkStyleLoose"));
            if (style.bluff === "often") parts.push(t("pkStyleBluffOften"));
            if (style.bluff === "rarely") parts.push(t("pkStyleBluffRare"));
            return parts.length ? parts.join(t("pkStyleSep")) : t("pkStyleSteady");
        }

        function newPkGame(opps) {
            pk.gen++;
            pk.seats = [
                { id: "", name: playerName, human: true, chips: PK_CHIPS, cards: [], style: null },
                ...opps.map((o) => ({ id: o.id, name: o.name, human: false, chips: PK_CHIPS, cards: [], style: null, fromBio: false })),
            ];
            pk.hand = 0;
            pk.button = Math.floor(Math.random() * pk.seats.length);
            pk.playing = true;
            pk.over = false;
            pk.left = false;
            pk.winners = [];
            pk.thinking = false;
            pk.leaveArmed = false;
            $("pk-log").innerHTML = "";
            $("pk-meta").textContent = t("strength", { level: t("level" + (pkLevel >= 1 && pkLevel <= 4 ? pkLevel : 2)) });
            pkAskStyles(opps);
            say(opps[0].id, t("pkStart", { player: playerName, npcs: joinNames(opps.map((o) => o.name)), small: PK_SMALL, big: PK_BIG, chips: PK_CHIPS, n: pkHands }));
            pkStartHand();
        }

        // Each NPC's way of playing comes from their character, read by SkyrimNet (mgStyles ->
        // mgStyle). Until it comes, or for a while if it does not, the NPCs wait to act.
        function pkAskStyles(opps) {
            pk.stylesReady = false;
            const gen = pk.gen;
            const settle = () => {
                if (gen !== pk.gen || pk.stylesReady) return;
                pk.seats.forEach((s) => {
                    if (!s.human && !s.style) {
                        s.style = { ...PK_DEFAULT_STYLE };
                        log(t("pkLogStyleDefault", { who: s.name }), "pk-log");
                    }
                });
                pk.stylesReady = true;
                reportPkState();
                pkStep();
            };
            if (typeof window.mgStyles !== "function") {
                setTimeout(settle, 0);   // a plain browser
                return;
            }
            send("mgStyles", JSON.stringify(opps.map((o) => ({ id: o.id, name: o.name }))));
            setTimeout(settle, 20000);
        }

        // An NPC's way of playing: {id, hands, bets, bluff}, or {id, failed: true}.
        window.mgStyle = (r) => {
            const s = r && pk.seats.find((x) => !x.human && x.id === r.id);
            if (!s || s.style || pk.stylesReady) return;
            const ok = !r.failed && r.hands in PK_LOOSE && r.bets in PK_BOLD && r.bluff in PK_BLUFF;
            s.style = ok ? { hands: r.hands, bets: r.bets, bluff: r.bluff } : { ...PK_DEFAULT_STYLE };
            s.fromBio = ok;
            log(ok ? t("pkLogStyle", { who: s.name, style: pkStyleLabel(s.style) }) : t("pkLogStyleDefault", { who: s.name }), "pk-log");
            if (pk.seats.every((x) => x.human || x.style)) {
                pk.stylesReady = true;
            }
            reportPkState();
            pkStep();
        };

        // Seat s puts chips in, up to all it has; returns how many.
        function pkPut(s, amount) {
            const a = Math.min(amount, s.chips);
            s.chips -= a;
            s.bet += a;
            s.total += a;
            if (s.chips === 0) s.allIn = true;
            return a;
        }

        function pkStartHand() {
            pk.hand++;
            pk.phase = "bet";
            pk.street = 0;
            pk.board = [];
            pk.allCards = newDeck();
            pk.deck = pk.allCards.slice();
            pk.results = "";
            pk.showdown = false;
            pk.lastRaiser = -1;
            pk.leaveArmed = false;
            pk.fresh = null;
            for (const s of pk.seats) {
                s.inHand = s.chips > 0;
                s.cards = [];
                s.bet = 0;
                s.total = 0;
                s.folded = !s.inHand;
                s.allIn = false;
                s.acted = false;
                s.won = 0;
                s.score = 0;
            }
            pk.button = pkNext(pk.button, (s) => s.inHand);
            // heads up, the dealer posts the small blind and acts first before the flop
            const heads = pk.seats.filter((s) => s.inHand).length === 2;
            const sb = heads ? pk.button : pkNext(pk.button, (s) => s.inHand);
            const bb = pkNext(sb, (s) => s.inHand);
            pkPut(pk.seats[sb], PK_SMALL);
            pkPut(pk.seats[bb], PK_BIG);
            pk.currentBet = PK_BIG;
            pk.minRaise = PK_BIG;
            for (let pass = 0; pass < 2; pass++) {
                for (let k = 1; k <= pk.seats.length; k++) {
                    const s = pk.seats[(pk.button + k) % pk.seats.length];
                    if (s.inHand) s.cards.push(pk.deck.pop());
                }
            }
            log(t("pkLogHand", { h: pk.hand, n: pkHands, who: pkName(pk.button) }), "pk-log");
            log(t("pkLogBlinds", { sb: pkName(sb), s: PK_SMALL, bb: pkName(bb), b: PK_BIG }), "pk-log");
            pk.turn = pkNext(bb, pkCanAct);
            pk.raiseTo = 0;
            reportPkState();
            const actors = pk.seats.filter(pkCanAct);
            if (!actors.length || (actors.length === 1 && actors[0].bet >= pk.currentBet)) {
                pkRunOut();   // the blinds put everyone all in
                return;
            }
            pkStep();
        }

        // The seat to act moves: the player through the controls, an NPC once the table is
        // quiet and the ways of playing are known.
        function pkStep() {
            renderPk();
            if (!pk.playing || pk.over || pk.thinking) {
                return;
            }
            const me = pk.seats[0];
            const mine = pk.phase === "result" ? me.chips > 0 : pk.turn === 0;
            if (mine || (pk.phase === "bet" && !pk.stylesReady)) {
                return;
            }
            pk.thinking = true;
            const gen = pk.gen;
            renderPkStatus();
            whenQuiet(() => {
                if (gen !== pk.gen) return;
                if (screen !== "pk") {
                    // carried on when the table is back on screen
                    pk.thinking = false;
                    return;
                }
                renderPkStatus();
                setTimeout(() => {
                    if (gen !== pk.gen) return;
                    pk.thinking = false;
                    if (screen !== "pk") return;
                    if (pk.phase === "result") {
                        pkStartHand();
                        return;
                    }
                    const move = pkDecide(pk.turn);
                    pkAct(pk.turn, move.act, move.to);
                }, pk.phase === "result" ? 2500 : 800 + Math.random() * 800);
            });
        }

        // Seat i acts. to: for a raise, the seat's whole bet this street.
        function pkAct(i, act, to) {
            const s = pk.seats[i];
            const before = pk.currentBet;
            pk.leaveArmed = false;
            let mine = null;  // the player's own line about the move, if they speak (MCM)
            let comment = null;  // an NPC's line about a bet
            if (act === "fold") {
                s.folded = true;
                log(t("pkLogFold", { who: s.name }), "pk-log");
                mine = ["pPkFold", {}];
            } else if (act === "check") {
                log(t("pkLogCheck", { who: s.name }), "pk-log");
                mine = ["pPkCheck", {}];
            } else if (act === "call") {
                const n = pkPut(s, pkToCall(s));
                log(t(s.allIn ? "pkLogAllIn" : "pkLogCall", { who: s.name, n: s.allIn ? s.bet : n }), "pk-log");
                mine = [s.allIn ? "pPkAllIn" : "pPkCall", { n: s.allIn ? s.bet : n }];
            } else {
                pkPut(s, Math.max(0, Math.min(to, pkMaxRaiseTo(s)) - s.bet));
                const by = s.bet - before;
                if (by >= pk.minRaise) {
                    pk.minRaise = by;
                }
                if (s.bet > before) {
                    pk.currentBet = s.bet;
                    pk.lastRaiser = i;
                    // everyone else still in has to answer it
                    pk.seats.forEach((x, k) => {
                        if (k !== i && pkCanAct(x)) x.acted = false;
                    });
                }
                log(t(s.allIn ? "pkLogAllIn" : before === 0 ? "pkLogBet" : "pkLogRaise", { who: s.name, n: s.bet }), "pk-log");
                mine = [s.allIn ? "pPkAllIn" : before === 0 ? "pPkBet" : "pPkRaise", { n: s.bet }];
                // one line about it, from the one who did it or the next NPC to answer
                const speaker = s.human ? pkSpeakerAfter(i) : s;
                const line = s.allIn ? "pkAllInLine" : before === 0 ? "pkBetLine" : "pkRaiseLine";
                if (speaker) comment = [speaker.id, t(line, { who: s.name, n: s.bet, pot: pkPot() })];
            }
            // the player says their move first (kept: it is not dropped for a newer line), then
            // the NPC answers a bet; the NPCs' own bets are told by themselves
            if (s.human && playerVoice && mine) {
                say(PLAYER_ID, t(mine[0], mine[1]), true);
            }
            if (comment) {
                say(comment[0], comment[1]);
            }
            s.acted = true;
            pkAfterAction(i);
        }

        // The NPC who answers next after seat i, or the first still in.
        function pkSpeakerAfter(i) {
            const k = pkNext(i, (x) => !x.human && pkInPlay(x));
            return k >= 0 ? pk.seats[k] : pk.seats.find((x) => !x.human);
        }

        function pkAfterAction(i) {
            const inPlay = pk.seats.filter(pkInPlay);
            if (inPlay.length === 1) {
                pkFoldWin(pk.seats.indexOf(inPlay[0]));
                return;
            }
            const pending = (x) => pkCanAct(x) && (!x.acted || x.bet < pk.currentBet);
            const next = pkNext(i, pending);
            if (next >= 0) {
                pk.turn = next;
                pk.raiseTo = 0;
                reportPkState();
                pkStep();
                return;
            }
            // the street is done
            if (pk.street === 3) {
                pkShowdown();
            } else if (pk.seats.filter(pkCanAct).length <= 1) {
                pkRunOut();
            } else {
                pkNextStreet();
            }
        }

        function pkDealBoard() {
            const n = pk.street === 1 ? 3 : 1;
            const cards = [];
            for (let k = 0; k < n; k++) cards.push(pk.deck.pop());
            pk.board.push(...cards);
            log(t("pkLogBoard", { street: t(["", "pkFlop", "pkTurn", "pkRiver"][pk.street]), cards: pkCardsText(cards) }), "pk-log");
        }

        function pkNextStreet() {
            pk.street++;
            pk.seats.forEach((s) => {
                s.bet = 0;
                s.acted = false;
            });
            pk.currentBet = 0;
            pk.minRaise = PK_BIG;
            pk.lastRaiser = -1;
            pkDealBoard();
            pk.turn = pkNext(pk.button, pkCanAct);
            pk.raiseTo = 0;
            reportPkState();
            pkStep();
        }

        // No more betting can happen: the rest of the cards come out, then the showdown.
        function pkRunOut() {
            while (pk.street < 3) {
                pk.street++;
                pkDealBoard();
            }
            pkShowdown();
        }

        // An uncalled bet goes back to whoever made it.
        function pkReturnUncalled() {
            const totals = pk.seats.map((s) => s.total).sort((a, b) => b - a);
            const top = pk.seats.find((s) => s.total === totals[0]);
            if (totals[0] > totals[1]) {
                const back = totals[0] - totals[1];
                top.total -= back;
                top.chips += back;
                if (top.chips > 0) top.allIn = false;
            }
        }

        // Everyone else folded.
        function pkFoldWin(w) {
            pkReturnUncalled();
            const s = pk.seats[w];
            const pot = pkPot();
            s.chips += pot;
            s.won = pot;
            pk.results = t("pkResultTake", { name: s.name, n: pot });
            log(t("pkLogWin", { who: s.name, n: pot, hand: "" }), "pk-log");
            const big = pot >= PK_BIG * 4;
            pkHandOver(big ? t("pkFoldWinLine", { who: s.name, n: pot }) : "", s.human ? null : s);
        }

        // The cards of those still in come up, and each pot goes to the best hand that may win it.
        function pkShowdown() {
            pk.showdown = true;
            pkReturnUncalled();
            const contenders = pk.seats.filter(pkInPlay);
            contenders.forEach((s) => { s.score = pkBest([...s.cards, ...pk.board]); });
            // side pots: one for each amount an all-in player could match
            const levels = [...new Set(contenders.map((s) => s.total))].sort((a, b) => a - b);
            levels.forEach((level, j) => {
                const prev = j ? levels[j - 1] : 0;
                const cap = j === levels.length - 1 ? Infinity : level;
                const amount = pk.seats.reduce((n, s) => n + Math.min(s.total, cap) - Math.min(s.total, prev), 0);
                const eligible = contenders.filter((s) => s.total >= level);
                const best = Math.max(...eligible.map((s) => s.score));
                const winners = eligible.filter((s) => s.score === best);
