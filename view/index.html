                const share = Math.floor(amount / winners.length);
                winners.forEach((s) => { s.chips += share; s.won += share; });
                // what does not split evenly goes to the first winner after the dealer
                const rest = amount - share * winners.length;
                if (rest > 0) {
                    const first = pk.seats[pkNext(pk.button, (x) => winners.includes(x))];
                    first.chips += rest;
                    first.won += rest;
                }
            });
            const winners = contenders.filter((s) => s.won > 0);
            pk.results = winners.map((s) => t("pkResultWin", { name: s.name, n: s.won, hand: pkHandName(s.score) })).join(t("listComma"));
            winners.forEach((s) => log(t("pkLogWin", { who: s.name, n: s.won, hand: " (" + pkHandName(s.score) + ")" }), "pk-log"));
            const shows = contenders.map((s) => t("pkShows", { name: s.name, cards: pkCardsText(s.cards), hand: pkHandName(s.score) })).join(t("listComma"));
            const npcWinner = winners.find((s) => !s.human);
            pkHandOver(t("pkShowdownLine", { h: pk.hand, board: pkCardsText(pk.board), shows, results: pk.results }), npcWinner || null);
        }

        // The hand is over: who is out, and whether the game is.
        function pkHandOver(text, speaker) {
            pk.phase = "result";
            pk.fresh = null;
            const out = pk.seats.filter((s) => s.inHand && s.chips <= 0);
            out.forEach((s) => log(t("logOut", { who: s.name }), "pk-log"));
            if (out.length) {
                text += t("pkOut", { names: joinNames(out.map((s) => s.name)) });
            }
            const left = pk.seats.filter((s) => s.chips > 0);
            pk.over = left.length <= 1 || pk.hand >= pkHands;
            const npcs = pk.seats.filter((s) => !s.human);
            speaker = speaker || npcs.filter((s) => s.inHand).sort((a, b) => b.total - a.total)[0] || npcs[0];
            if (pk.over) {
                const top = Math.max(...pk.seats.map((s) => s.chips));
                pk.winners = pk.seats.flatMap((s, k) => (s.chips === top ? [k] : []));
                const champ = pk.winners.find((k) => k > 0);
                if (pk.winners.length > 1) {
                    speaker = pk.seats[champ];
                    text += t("pkEndTie", { names: joinNames(pk.winners.map(pkName)), chips: top, npc: speaker.name });
                } else if (pk.winners[0] === 0) {
                    text += t("pkEndPlayerWins", { player: playerName, chips: top, npc: speaker.name });
                } else {
                    speaker = pk.seats[champ];
                    text += t("pkEndNpcWins", { npc: speaker.name, chips: top });
                }
                log(t("stbLogEnd", { result: pkResult() }), "pk-log");
            }
            if (text) {
                say(speaker.id, text.trim(), pk.over);
            }
            reportPkState();
            pkStep();
        }

        function pkResult() {
            if (pk.winners.length > 1) {
                return t("stbTieResult", { names: joinNames(pk.winners.map(pkName)) });
            }
            return t("resultWin", { name: pkName(pk.winners[0]) });
        }

        // ---- the player's controls ----

        // Out of chips and no longer in the hand: the player only watches.
        const pkWatching = () => pk.seats[0].chips <= 0 && !(pk.phase === "bet" && pkInPlay(pk.seats[0]));
        const pkMine = () => pk.playing && !pk.over && pk.phase === "bet" && pk.turn === 0 && screen === "pk";

        function pkRaiseBounds() {
            const me = pk.seats[0];
            return { min: pkMinRaiseTo(me), max: pkMaxRaiseTo(me) };
        }

        function onPkFold() {
            if (pkMine() && pkToCall(pk.seats[0]) > 0) pkAct(0, "fold");
        }

        function onPkCall() {
            if (pkMine()) pkAct(0, pkToCall(pk.seats[0]) > 0 ? "call" : "check");
        }

        function onPkRaise() {
            if (pkMine() && pkCanRaise(pk.seats[0])) pkAct(0, "raise", pk.raiseTo);
        }

        function onPkAllIn() {
            if (!pkMine()) return;
            const me = pk.seats[0];
            if (pkCanRaise(me)) pkAct(0, "raise", pkMaxRaiseTo(me));
            else pkAct(0, "call");
        }

        function adjustPkRaise(d) {
            if (!pkMine()) return;
            const b = pkRaiseBounds();
            pk.raiseTo = Math.min(Math.max(pk.raiseTo + d * PK_BIG, b.min), b.max);
            renderPk();
        }

        function onPkNext() {
            if (pk.playing && !pk.over && pk.phase === "result" && pk.seats[0].chips > 0) pkStartHand();
        }

        function onPkLeave() {
            if (!pk.playing || pk.over) return;
            const watching = pkWatching();
            if (!pk.leaveArmed && !watching) {
                pk.leaveArmed = true;
                renderPk();
                return;
            }
            pk.gen++;
            pk.over = true;
            pk.left = true;
            pk.thinking = false;
            pk.leaveArmed = false;
            const first = pk.seats.find((s) => !s.human && s.chips > 0) || pk.seats[1];
            say(first.id, t(watching ? "pkStopWatching" : "pkLeave", { player: playerName }), true);
            log(t("logLeave", { player: playerName }), "pk-log");
            reportPkState();
            renderPk();
        }

        function onPkAgain() {
            newPkGame(pkOpponents());
        }

        // ---- what each NPC knows ----

        // Each NPC sees its own two cards and the table, never anyone else's cards.
        function pkStateFor(k) {
            const s = pk.seats[k];
            const vars = {
                npc: s.name, player: playerName, h: pk.hand, n: pkHands, chips: pkChipsLine(),
                others: joinNames(pk.seats.filter((x) => x !== s).map((x) => x.name)),
            };
            if (pk.over) {
                if (screen !== "pk") return "";
                return pk.left ? t("pkStateLeft", vars) : t("pkStateResult", { ...vars, result: pkResult() });
            }
            if (!pk.playing) return "";
            let text = t("pkState", vars);
            if (s.style && s.fromBio) {
                text += t("pkStateStyle", { npc: s.name, style: pkStyleLabel(s.style) });
            }
            if (!s.inHand) {
                text += t("pkStateOut", vars);
            } else if (s.folded) {
                text += t("pkStateFolded", vars);
            } else if (s.cards.length) {
                text += t("pkStateCards", { npc: s.name, cards: pkCardsText(s.cards) });
            }
            const table = { pot: pkPot(), bet: pk.currentBet };
            text += pk.board.length ? t("pkStateBoard", { ...table, board: pkCardsText(pk.board) }) : t("pkStateNoBoard", table);
            if (pk.phase === "result") {
                text += t("bjStateRound", { results: pk.results });
            } else if (pk.turn >= 0) {
                text += t("dStateTurn", { who: pkName(pk.turn) });
            }
            if (screen !== "pk") text += t("pkStatePaused");
            return text;
        }

        function reportPkState() {
            if (activeGame !== "pk") return;
            const states = {};
            pk.seats.forEach((s, k) => {
                if (!s.human) states[s.id] = pkStateFor(k);
            });
            send("rvState", JSON.stringify({ states, playing: pk.playing && !pk.over }));
        }

        // A game in progress is dropped (another game is starting).
        function abandonPk() {
            if (pk.playing && !pk.over) {
                pk.playing = false;
                pk.gen++;
                pk.thinking = false;
                voiceReset();
            }
        }

        const pkUnfinishedWith = (opps) => pk.playing && !pk.over &&
            pkOpponents().map((o) => o.id).join() === opps.map((o) => o.id).join();

        // Starts or resumes Texas Hold'em against opps ([{id, name}], one to three).
        function playPk(opps) {
            const same = pkUnfinishedWith(opps);
            if (!same) abandonPk();
            abandonDice();
            abandonStb();
            abandonBj();
            abandonReversi();
            activeGame = "pk";
            abandonCheckersAndCribbage();
            send("mgPlayers", opps.map((o) => o.id).join(","));
            if (same) {
                showScreen("pk");
                log(t("logResume"), "pk-log");
                reportPkState();
                pkStep();
                return;
            }
            snapFaces(opps.map((o) => o.id), () => {
                showScreen("pk");
                newPkGame(opps);
            });
        }

        // ---- rendering ----

        // A seat's cards: face down, or face up for the player and at the showdown.
        function pkFillCards(box, s, size) {
            box.innerHTML = "";
            if (!s.inHand || s.folded) return;
            const up = s.human || (pk.showdown && pkInPlay(s));
            s.cards.forEach((c) => box.appendChild(cardEl(c, size, !up)));
            if (up && pk.showdown && s.score) {
                const name = document.createElement("span");
                name.className = "hand-total";
                name.textContent = pkHandName(s.score);
                box.appendChild(name);
            }
        }

        function pkMetaText(s, k) {
            if (!s.inHand && pk.phase !== "result") return t("diceOut");
            if (s.chips <= 0 && pk.phase === "result" && !s.won) return t("diceOut");
            // once the hand is over, only the chips and what was won
            if (pk.phase === "result") {
                return t("bjChips", { chips: s.chips }) + (s.won ? " · +" + s.won : "");
            }
            const parts = [s.bet ? t("bjChipsBet", { chips: s.chips, bet: s.bet }) : t("bjChips", { chips: s.chips })];
            if (s.folded && s.inHand) parts.push(t("pkFolded"));
            else if (s.allIn) parts.push(t("pkAllInMark"));
            return parts.join(" · ");
        }

        function renderPk() {
            if (!pk.seats.length) return;
            const live = pk.playing && !pk.over;
            const seats = $("pk-seats");
            seats.innerHTML = "";
            pk.seats.forEach((s, k) => {
                if (s.human) return;
                const card = document.createElement("div");
                card.className = "seat" + (live && pk.phase === "bet" && pk.turn === k ? " active" : "") + (s.inHand && !s.folded ? "" : " out");
                const name = document.createElement("div");
                name.className = "seat-name";
                name.textContent = s.name + (k === pk.button ? " (" + t("pkDealer") + ")" : "");
                const style = document.createElement("div");
                style.className = "seat-meta";
                style.textContent = pkStyleLabel(s.style);
                const hand = document.createElement("div");
                hand.className = "hand small";
                pkFillCards(hand, s, "small");
                const meta = document.createElement("div");
                meta.className = "seat-meta";
                meta.textContent = pkMetaText(s, k);
                card.append(faceEl(s.id, s.name), name, style, hand, meta);
                seats.appendChild(card);
            });

            $("pk-label").textContent = t("pkHandLabel", { h: pk.hand, n: pkHands, pot: pkPot() });
            const board = $("pk-board");
            board.innerHTML = "";
            // all five places on the table, face down until their card is dealt
            pk.board.forEach((c) => board.appendChild(cardEl(c, "big", false)));
            for (let k = pk.board.length; k < 5; k++) {
                board.appendChild(cardEl(null, "big", true));
            }

            const me = pk.seats[0];
            $("pk-mine").classList.toggle("active", live && pk.phase === "bet" && pk.turn === 0);
            $("pk-mine-name").textContent = me.name + (pk.button === 0 ? " (" + t("pkDealer") + ")" : "");
            pkFillCards($("pk-mine-hand"), me, "mid");
            $("pk-mine-meta").textContent = pkMetaText(me, 0);

            // controls
            const mine = pkMine();
            $("pk-moves").style.display = mine ? "" : "none";
            $("pk-raise-row").style.display = mine && pkCanRaise(me) ? "" : "none";
            if (mine) {
                const toCall = pkToCall(me);
                const b = pkRaiseBounds();
                if (pk.raiseTo < b.min || pk.raiseTo > b.max) pk.raiseTo = b.min;
                $("pk-fold").disabled = toCall === 0;
                $("pk-call").textContent = toCall === 0 ? t("pkCheck") : t(toCall >= me.chips ? "pkCallAllIn" : "pkCall", { n: toCall });
                $("pk-raise").textContent = t(pk.currentBet === 0 ? "pkBet" : "pkRaise", { n: pk.raiseTo });
                $("pk-raise-down").disabled = pk.raiseTo <= b.min;
                $("pk-raise-up").disabled = pk.raiseTo >= b.max;
                $("pk-allin").textContent = t("pkAllIn", { n: me.bet + me.chips });
            }
            $("pk-next").style.display = live && pk.phase === "result" && me.chips > 0 ? "" : "none";
            $("pk-leave").style.display = live ? "" : "none";
            $("pk-leave").textContent = t(pkWatching() ? "stopWatching" : pk.leaveArmed ? "leaveConfirm" : "leave");
            $("pk-again").style.display = pk.over ? "" : "none";
            renderPkStatus();
        }

        function renderPkStatus() {
            if (!pk.seats.length) return;
            const lines = [];
            const me = pk.seats[0];
            if (pk.phase === "result" && pk.results) lines.push(pk.results);
            if (pk.over) {
                const top = pk.left ? 0 : pk.seats[pk.winners[0]].chips;
                if (pk.left) {
                    lines.length = 0;
                    lines.push(t("diceLeftStatus"));
                } else if (pk.winners.length > 1) {
                    lines.push(t("bjTieStatus", { names: joinNames(pk.winners.map(pkName)), chips: top }));
                } else if (pk.winners[0] === 0) {
                    lines.push(t("bjYouWin", { chips: top }));
                } else {
                    lines.push(t("bjNpcWins", { npc: pkName(pk.winners[0]), chips: top }));
                }
            } else if (pk.playing) {
                if (pkWatching()) lines.push(t("bjWatching"));
                if (pkMine()) {
                    const toCall = pkToCall(me);
                    lines.push(toCall > 0 ? t("pkYourTurn", { n: toCall }) : t("pkYourTurnFree"));
                } else if (pk.phase === "bet" && pk.turn !== 0) {
                    if (!pk.stylesReady) {
                        lines.push(t("pkReading"));
                    } else if (voiceLine && voiceLine.speaker !== PLAYER_ID) {
                        const speaker = pk.seats.find((x) => x.id === voiceLine.speaker);
                        lines.push(t("diceListening", { npc: speaker ? speaker.name : pkName(pk.turn) }));
                    } else if (pk.turn >= 0) {
                        lines.push(t("thinking", { npc: pkName(pk.turn) }));
                    }
                }
            }
            $("pk-status").textContent = lines.join("\n");
        }

        // ===== Checkers and Cribbage: shared =====

        // Checkers and Cribbage step aside when one of the original games starts.
        function abandonCheckersAndCribbage() {
            abandonCheckers();
            abandonCribbage();
        }

        // The strength control on both panels: four steps, lit up to the level. Plain elements, not
        // <input type="range">: Ultralight, which draws the page in game, paints no form controls.
        function renderLevelSteps(id, lvl) {
            [...$(id).children].forEach((el, i) => el.classList.toggle("on", i < lvl));
        }

        // ===== Checkers =====

        // American checkers on an 8×8 board, against one opponent. Men step and capture diagonally
        // forward, kings one square either way. A capture must be taken, and a jump goes on while
        // it can; a man crowned on a jump stops there. Black moves first. A side with no move left
        // loses. 40 moves each with no capture and no man moved is a draw.
        //
        // The board: 64 squares, row * 8 + col, row 0 at the top. Only (row + col) odd is played.
        // The player's pieces always start at the bottom (rows 5 to 7).
        const CK_BLACK = 1, CK_RED = 2, CK_KING = 4, CK_DEAD = 8;   // a square: colour | CK_KING
        const CK_QUIET_LIMIT = 80;      // half moves with no capture and no man moved: a draw
        const CK_WIN = 100000;

        const CK_UP = [[-1, -1], [-1, 1]];
        const CK_DOWN = [[1, -1], [1, 1]];
        const CK_ALL_DIRS = [...CK_UP, ...CK_DOWN];

        const ckColor = (p) => p & 3;
        const ckIsKing = (p) => (p & CK_KING) !== 0;
        const ckOther = (c) => 3 - c;
        const ckFarRow = (c, bottom) => (c === bottom ? 0 : 7);
        // Men only go forward: up the board for the side at the bottom.
        const ckDirs = (p, bottom) => (ckIsKing(p) ? CK_ALL_DIRS : ckColor(p) === bottom ? CK_UP : CK_DOWN);

        // The opening position, with colour bottom at the bottom.
        function ckStartBoard(bottom) {
            const b = new Array(64).fill(0);
            for (let i = 0; i < 64; i++) {
                const r = i >> 3, k = i & 7;
                if ((r + k) % 2 === 1) {
                    if (r <= 2) {
                        b[i] = ckOther(bottom);
                    } else if (r >= 5) {
                        b[i] = bottom;
                    }
                }
            }
            return b;
        }

        // Every legal move for colour c: {path: [from, ..., to], caps: [captured squares], crown}.
        // Jumps only, when there is one.
        function ckMoves(b, c, bottom) {
            const jumps = [];
            for (let i = 0; i < 64; i++) {
                if (b[i] && ckColor(b[i]) === c) {
                    ckJumpsFrom(b, i, bottom, jumps);
                }
            }
            if (jumps.length) {
                return jumps;
            }
            const steps = [];
            for (let i = 0; i < 64; i++) {
                const p = b[i];
                if (!p || ckColor(p) !== c) {
                    continue;
                }
                const r = i >> 3, k = i & 7;
                for (const [dr, dc] of ckDirs(p, bottom)) {
                    const r2 = r + dr, k2 = k + dc;
                    if (r2 < 0 || r2 > 7 || k2 < 0 || k2 > 7 || b[r2 * 8 + k2]) {
                        continue;
                    }
                    steps.push({ path: [i, r2 * 8 + k2], caps: [], crown: !ckIsKing(p) && r2 === ckFarRow(c, bottom) });
                }
            }
            return steps;
        }

        // Every complete jump from square i, added to out. A captured piece stays on the board
        // until the move is over (marked dead): it can be neither jumped again nor landed on.
        function ckJumpsFrom(b, i, bottom, out) {
            const p = b[i];
            const work = b.slice();
            work[i] = 0;
            const walk = (at, path, caps) => {
                const r = at >> 3, k = at & 7;
                let further = false;
                for (const [dr, dc] of ckDirs(p, bottom)) {
                    const r2 = r + 2 * dr, k2 = k + 2 * dc;
                    if (r2 < 0 || r2 > 7 || k2 < 0 || k2 > 7) {
                        continue;
                    }
                    const mid = (r + dr) * 8 + (k + dc), land = r2 * 8 + k2;
                    const q = work[mid];
                    if (!q || q === CK_DEAD || ckColor(q) === ckColor(p) || work[land]) {
                        continue;
                    }
                    further = true;
                    work[mid] = CK_DEAD;
                    if (!ckIsKing(p) && r2 === ckFarRow(ckColor(p), bottom)) {
                        out.push({ path: [...path, land], caps: [...caps, mid], crown: true });
                    } else {
                        walk(land, [...path, land], [...caps, mid]);
                    }
                    work[mid] = q;
                }
                if (!further && caps.length) {
                    out.push({ path, caps, crown: false });
                }
            };
            walk(i, [i], []);
        }

        // The board after move m.
        function ckApply(b, m) {
            const nb = b.slice();
            const p = nb[m.path[0]];
            nb[m.path[0]] = 0;
            for (const x of m.caps) {
                nb[x] = 0;
            }
            nb[m.path[m.path.length - 1]] = m.crown ? p | CK_KING : p;
            return nb;
        }

        function ckCount(b, c) {
            let all = 0, kings = 0;
            for (const p of b) {
                if (p && ckColor(p) === c) {
                    all++;
                    if (ckIsKing(p)) {
                        kings++;
                    }
                }
            }
            return { all, kings };
        }

        // ---- opponent AI ----

        // How good the board is for c: material, men worth a little more as they near the crown,
        // back-row men kept home (they stop the other side crowning), the centre, and (when ahead)
        // fewer pieces left, since trading down wins.
        function ckEvaluate(b, c, bottom) {
            let score = 0, mine = 0, theirs = 0;
            for (let i = 0; i < 64; i++) {
                const p = b[i];
                if (!p) {
                    continue;
                }
                const r = i >> 3, k = i & 7;
                let v;
                if (ckIsKing(p)) {
                    v = 160;
                } else {
                    const advanced = ckColor(p) === bottom ? 7 - r : r;
                    v = 100 + advanced * 3 + (advanced === 0 ? 8 : 0);
                }
                if (k >= 2 && k <= 5 && r >= 2 && r <= 5) {
                    v += 4;
                }
                if (ckColor(p) === c) {
                    score += v;
                    mine++;
                } else {
                    score -= v;
                    theirs++;
                }
            }
            if (mine !== theirs) {
                score += (mine > theirs ? 1 : -1) * (24 - mine - theirs) * 3;
            }
            return score;
        }

        // Negamax with alpha-beta for c to move. Past depth 0 it only goes on while captures are
        // forced (to 6 half moves more), so it never stops in the middle of an exchange. budget:
        // {left, until}, the nodes it may still visit and the time it must be done by; once
        // either runs out it throws the budget.
        function ckSearch(b, c, bottom, depth, alpha, beta, budget) {
            if (--budget.left < 0 || ((budget.left & 1023) === 0 && Date.now() > budget.until)) {
                throw budget;
            }
            const moves = ckMoves(b, c, bottom);
            if (!moves.length) {
                return -CK_WIN - depth;    // lost: the sooner, the worse
            }
            if ((depth <= 0 && !moves[0].caps.length) || depth <= -6) {
                return ckEvaluate(b, c, bottom);
            }
            let best = -Infinity;
            for (const m of moves) {
                const v = -ckSearch(ckApply(b, m), ckOther(c), bottom, depth - 1, -beta, -alpha, budget);
                if (v > best) {
                    best = v;
                }
                if (v > alpha) {
                    alpha = v;
                }
                if (alpha >= beta) {
                    break;
                }
            }
            return best;
        }

        // depth: half moves looked ahead. noise: how far below the best a move may be and still
        // be picked (some variety, and the weaker levels miss things).
        const CK_LEVELS = {
            1: { depth: 2, noise: 70, random: 0.3 },
            2: { depth: 4, noise: 25, random: 0 },
            3: { depth: 6, noise: 6, random: 0 },
            4: { depth: 8, noise: 0, random: 0 },
        };
        // What one move's thinking may cost, whatever the level: the in-game browser may run
        // scripts far slower than a desktop one, and the board must never hang.
        const CK_NODE_BUDGET = 200000;
        const CK_TIME_BUDGET_MS = 800;

        // The move colour c plays. It searches one half move deeper each time, all on one budget;
        // the depth that runs out is dropped and the last finished one decides.
        function ckChoose(b, c, bottom, lvl) {
            const moves = ckMoves(b, c, bottom);
            if (moves.length <= 1) {
                return moves[0];
            }
            const cfg = CK_LEVELS[lvl] || CK_LEVELS[2];
            if (Math.random() < cfg.random) {
                return moves[Math.floor(Math.random() * moves.length)];
            }
            let scores = moves.map(() => 0);
            const budget = { left: CK_NODE_BUDGET, until: Date.now() + CK_TIME_BUDGET_MS };
            for (let d = 1; d <= cfg.depth; d++) {
                try {
                    scores = moves.map((m) => -ckSearch(ckApply(b, m), ckOther(c), bottom, d - 1, -Infinity, Infinity, budget));
                } catch (e) {
                    if (e !== budget) {
                        throw e;
                    }
                    break;
                }
            }
            const best = Math.max(...scores);
            const margin = Math.abs(best) > CK_WIN / 2 ? 0 : cfg.noise;
            const fine = moves.filter((m, k) => scores[k] >= best - margin);
            return fine[Math.floor(Math.random() * fine.length)];
        }

        // ---- flow ----

        // The opponent's strength, 1 to 4: from the plugin when it passes one (ckLevel), else Normal,
        // and set during play by the four steps on the panel. Read at every move, so a change
        // counts from the next one.
        let ckLevel = 2;

        function onCkLevel(v) {
            ckLevel = Math.min(4, Math.max(1, Number(v) || 2));
            renderCk();
        }

        const ck = {
            gen: 0,          // bumped when a game is left or dropped: its pending steps stop
            b: [],
            bottom: CK_BLACK,  // the player's colour (the player sits at the bottom)
            turn: CK_BLACK,  // the colour to move
            opp: { id: "", name: "" },
            playing: false,
            over: false,
            left: false,     // the player left before the end
            winner: 0,       // the winning colour, 0 for a draw
            quiet: 0,        // half moves with no capture and no man moved
            sel: [],         // the squares of the player's move so far
            last: null,      // the last move, marked on the board
            thinking: false, // an NPC's move is on its way
            leaveArmed: false,
            lastColor: 0,    // the player's colour last game, for "alternate"
        };

        const ckNpcColor = () => ckOther(ck.bottom);
        const ckName = (c) => (c === ck.bottom ? playerName : ck.opp.name);
        const ckColorName = (c) => t(c === CK_BLACK ? "ckBlack" : "ckRed");
        const ckPlayerActs = () => ck.playing && !ck.over && !ck.thinking && ck.turn === ck.bottom && screen === "ck";
        const ckSquareName = (i) => "abcdefgh"[i & 7] + (8 - (i >> 3));
        const ckMoveText = (m) => m.path.map(ckSquareName).join(m.caps.length ? "×" : "–");

        // The player's colour, from the Reversi colour setting (black moves first).
        function ckPickColor() {
            switch (colorSetting) {
                case "white":
                    return CK_RED;
                case "random":
                    return Math.random() < 0.5 ? CK_BLACK : CK_RED;
                case "alternate":
                    return ck.lastColor === CK_BLACK ? CK_RED : CK_BLACK;
                default:
                    return CK_BLACK;
            }
        }

        function ckNewGame(opp) {
            ck.gen++;
            ck.opp = opp;
            ck.bottom = ckPickColor();
            ck.lastColor = ck.bottom;
            ck.b = ckStartBoard(ck.bottom);
            ck.turn = CK_BLACK;
            ck.playing = true;
            ck.over = false;
            ck.left = false;
            ck.winner = 0;
            ck.quiet = 0;
            ck.sel = [];
            ck.last = null;
            ck.thinking = false;
            ck.leaveArmed = false;
            $("ck-log").innerHTML = "";
            log(t("ckLogStart", { black: ckName(CK_BLACK), red: ckName(CK_RED) }), "ck-log");
            say(opp.id, t("ckSayStart", {
                player: playerName, npc: opp.name, first: ckName(CK_BLACK),
                npcColor: ckColorName(ckNpcColor()), playerColor: ckColorName(ck.bottom),
            }));
            reportCkState();
            ckStep();
        }

        // The side to move moves: the player through the board, the NPC once the table is quiet.
        function ckStep() {
            renderCk();
            if (!ck.playing || ck.over || ck.thinking || ck.turn === ck.bottom) {
                return;
            }
            ck.thinking = true;
            const gen = ck.gen;
            renderCkStatus();
            whenQuiet(() => {
                if (gen !== ck.gen) {
                    return;
                }
                if (screen !== "ck") {
                    // carried on when the board is back on screen
                    ck.thinking = false;
                    return;
                }
                renderCkStatus();
                setTimeout(() => {
                    if (gen !== ck.gen) {
                        return;
                    }
                    ck.thinking = false;
                    if (screen !== "ck") {
                        return;
                    }
                    ckPlay(ckChoose(ck.b, ck.turn, ck.bottom, ckLevel));
                }, 600 + Math.random() * 500);
            });
        }

        function ckPlay(m) {
            const mover = ck.turn;
            const man = !ckIsKing(ck.b[m.path[0]]);
            ck.b = ckApply(ck.b, m);
            ck.last = m;
            ck.sel = [];
            ck.leaveArmed = false;
            ck.quiet = m.caps.length || man ? 0 : ck.quiet + 1;
            log(t("ckLogMove", { who: ckName(mover), move: ckMoveText(m) + (m.crown ? " ♛" : "") }), "ck-log");
            ck.turn = ckOther(mover);

            if (!ckMoves(ck.b, ck.turn, ck.bottom).length) {
                ckEnd(mover);
                return;
            }
            if (ck.quiet >= CK_QUIET_LIMIT) {
                ckEnd(0);
                return;
            }

            // a crown, or two or more taken at once, is worth a word
            const byNpc = mover !== ck.bottom;
            const v = { npc: ck.opp.name, player: playerName, n: m.caps.length };
            let text = "";
            if (m.caps.length >= 2) {
                text += t(byNpc ? "ckSayMultiNpc" : "ckSayMultiPlayer", v);
            }
            if (m.crown) {
                text += (text ? " " : "") + t(byNpc ? "ckSayCrownNpc" : "ckSayCrownPlayer", v);
            }
            if (text) {
                const n = ckCount(ck.b, ckNpcColor()), h = ckCount(ck.b, ck.bottom);
                say(ck.opp.id, text + t("ckSayStanding", { ...v, n: n.all, h: h.all }));
            }
            reportCkState();
            ckStep();
        }

        // winner: the colour that won, 0 for a draw.
        function ckEnd(winner) {
            ck.over = true;
            ck.winner = winner;
            ck.thinking = false;
            ck.sel = [];
            log(t("ckLogEnd", { result: ckResult() }), "ck-log");
            const v = { npc: ck.opp.name, player: playerName };
            say(ck.opp.id, t(winner === 0 ? "ckSayDraw" : winner === ck.bottom ? "ckSayPlayerWins" : "ckSayNpcWins", v), true);
            reportCkState();
            renderCk();
        }

        function ckResult() {
            return ck.winner === 0 ? t("ckDrawResult") : t("resultWin", { name: ckName(ck.winner) });
        }

        // ---- the player's moves ----

        // A click picks one of the player's pieces that can move, then the squares it lands on,
        // one jump at a time; the move is made once the squares picked are a whole move.
        function onCkSquare(i) {
            if (!ckPlayerActs()) {
                return;
            }
            const moves = ckMoves(ck.b, ck.bottom, ck.bottom);
            const p = ck.b[i];
            if (p && ckColor(p) === ck.bottom && ck.sel.length <= 1) {
                ck.sel = ck.sel[0] === i || !moves.some((m) => m.path[0] === i) ? [] : [i];
                renderCk();
                return;
            }
            if (!ck.sel.length) {
                return;
            }
            const want = [...ck.sel, i];
            const fits = moves.filter((m) => want.every((x, k) => m.path[k] === x));
            if (!fits.length) {
                return;
            }
            const whole = fits.find((m) => m.path.length === want.length);
            if (whole) {
                ckPlay(whole);
                return;
            }
            ck.sel = want;
            renderCk();
        }

        function onCkLeave() {
            if (!ck.playing || ck.over) {
                return;
            }
            if (!ck.leaveArmed) {
                ck.leaveArmed = true;
                renderCk();
                return;
            }
            ck.gen++;
            ck.over = true;
            ck.left = true;
            ck.thinking = false;
            ck.leaveArmed = false;
            ck.sel = [];
            say(ck.opp.id, t("ckSayLeave", { player: playerName, npc: ck.opp.name }), true);
            log(t("logLeave", { player: playerName }), "ck-log");
            reportCkState();
            renderCk();
        }

        function onCkAgain() {
            ckNewGame(ck.opp);
        }

        // ---- what the NPC knows ----

        function ckStateFor() {
            const v = { npc: ck.opp.name, player: playerName };
            if (ck.over) {
                if (screen !== "ck") {
                    return "";
                }
                return ck.left ? t("ckStateLeft", v) : t("ckStateResult", { ...v, result: ckResult() });
            }
            if (!ck.playing) {
                return "";
            }
            const n = ckCount(ck.b, ckNpcColor()), h = ckCount(ck.b, ck.bottom);
            let text = t("ckState", {
                ...v, npcColor: ckColorName(ckNpcColor()), playerColor: ckColorName(ck.bottom),
                n: n.all, nk: n.kings, h: h.all, hk: h.kings,
            });
            text += t("ckStateTurn", { who: ckName(ck.turn) });
            if (screen !== "ck") {
                text += t("ckStatePaused");
            }
            return text;
        }

        function reportCkState() {
            if (activeGame !== "ck") {
                return;
            }
            send("rvState", JSON.stringify({ states: { [ck.opp.id]: ckStateFor() }, playing: ck.playing && !ck.over }));
        }

        // A game in progress is dropped (another game is starting).
        function abandonCheckers() {
            if (ck.playing && !ck.over) {
                ck.playing = false;
                ck.gen++;
                ck.thinking = false;
                voiceReset();
            }
        }

        // Starts or resumes checkers against opp ({id, name}).
        function playCheckers(opp) {
            const same = ck.playing && !ck.over && ck.opp.id === opp.id;
            if (!same) {
                abandonCheckers();
            }
            abandonReversi();
            abandonDice();
            abandonStb();
            abandonBj();
            abandonPk();
            abandonCribbage();
            activeGame = "ck";
            send("mgPlayers", opp.id);
            if (same) {
                showScreen("ck");
                log(t("logResume"), "ck-log");
                reportCkState();
                ckStep();
                return;
            }
            snapFaces([opp.id], () => {
                showScreen("ck");
                ckNewGame(opp);
            });
        }

        // ---- rendering ----

        function ckBuildBoard() {
            const box = $("ck-board");
            box.innerHTML = "";
            for (let i = 0; i < 64; i++) {
                const cell = document.createElement("div");
                cell.className = "ck-cell " + (((i >> 3) + (i & 7)) % 2 ? "dark" : "light");
                cell.onclick = () => onCkSquare(i);
                box.appendChild(cell);
            }
        }

        function ckPieceEl(p, cls = "") {
            const el = document.createElement("div");
            el.className = "ck-piece " + (ckColor(p) === CK_BLACK ? "black" : "red") + (ckIsKing(p) ? " king" : "") + (cls ? " " + cls : "");
            return el;
        }

        function renderCk() {
            if (!ck.b.length) {
                return;
            }
            const box = $("ck-board");
            if (box.children.length !== 64) {
                ckBuildBoard();
            }
            const acts = ckPlayerActs();
            const moves = acts ? ckMoves(ck.b, ck.bottom, ck.bottom) : [];
            const starts = new Set(moves.map((m) => m.path[0]));
            const along = ck.sel.length ? moves.filter((m) => ck.sel.every((x, k) => m.path[k] === x)) : [];
            const next = new Set(along.map((m) => m.path[ck.sel.length]));
            const last = new Set(ck.last ? ck.last.path : []);
            for (let i = 0; i < 64; i++) {
                const cell = box.children[i];
                cell.classList.toggle("last", last.has(i));
                cell.classList.toggle("legal", next.has(i));
                cell.classList.toggle("trail", ck.sel.length > 1 && ck.sel.includes(i));
                cell.innerHTML = "";
                if (ck.b[i]) {
                    const cls = ck.sel[0] === i ? "sel" : showHints && !ck.sel.length && starts.has(i) ? "can" : "";
                    cell.appendChild(ckPieceEl(ck.b[i], cls));
                }
            }

            const live = ck.playing && !ck.over;
            $("ck-face").dataset.face = ck.opp.id;
            paintFace($("ck-face"), ck.opp.id, ck.opp.name);
            const rows = [["npc", ckNpcColor(), ck.opp.name], ["human", ck.bottom, playerName]];
            for (const [who, c, name] of rows) {
                const n = ckCount(ck.b, c);
                $("ck-name-" + who).textContent = name;
                const icon = $("ck-icon-" + who);
                icon.innerHTML = "";
                icon.appendChild(ckPieceEl(c, "mini"));
                $("ck-count-" + who).textContent = n.kings ? t("ckCountKings", { n: n.all, k: n.kings }) : String(n.all);
                $("ck-row-" + who).classList.toggle("active", live && ck.turn === c);
            }
            $("ck-meta").textContent = t("strength", { level: t("level" + ckLevel) });
            renderLevelSteps("ck-level", ckLevel);
            $("ck-leave").style.display = live ? "" : "none";
            $("ck-leave").textContent = t(ck.leaveArmed ? "leaveConfirm" : "leave");
            $("ck-again").style.display = ck.over ? "" : "none";
            renderCkStatus();
        }

        function renderCkStatus() {
            if (!ck.b.length) {
                return;
            }
            let text = "";
            if (ck.over) {
                if (ck.left) {
                    text = t("diceLeftStatus");
                } else if (ck.winner === 0) {
                    text = t("ckDrawStatus");
                } else if (ck.winner === ck.bottom) {
                    text = t("ckYouWin");
                } else {
                    text = t("ckNpcWins", { npc: ck.opp.name });
                }
            } else if (ck.playing) {
                if (ck.turn === ck.bottom && !ck.thinking) {
                    const forced = ckMoves(ck.b, ck.bottom, ck.bottom)[0];
                    text = ck.sel.length > 1 ? t("ckYourJumpOn") : forced && forced.caps.length ? t("ckYourJump") : t("ckYourMove");
                } else if (voiceLine && voiceLine.speaker !== PLAYER_ID) {
                    text = t("diceListening", { npc: ck.opp.name });
                } else {
                    text = t("thinking", { npc: ck.opp.name });
                }
            }
            $("ck-status").textContent = text;
        }

        // ===== Cribbage =====

        // Two-handed cribbage to 121. Six cards each, two from each to the dealer's crib, then the
        // starter is cut (a jack: two for his heels, to the dealer). In the play, each card adds to
        // the count, up to 31: fifteen and thirty-one are two, a pair two, three and four of a kind
        // six and twelve, a run a point a card. Whoever cannot play says go; the last to play pegs
        // one (thirty-one already pegged two). Then the hands are shown: the pone's, the dealer's,
        // the crib. Whoever reaches 121 first wins at once.
        const CB_TARGET = 121;
        const CB_SKUNK = 91;      // the loser short of this has been skunked

        const cbValue = (c) => Math.min(c.r, 10);
        const cbSum = (cards) => cards.reduce((a, c) => a + cbValue(c), 0);

        // What 4 cards and the starter show: {total, fifteens, pairs, runs, flush, nobs}. crib: a
        // flush needs the starter too. starter null: what the 4 cards hold by themselves.
        function cbScore(hand, starter, crib) {
            const all = starter ? [...hand, starter] : hand.slice();
            const n = all.length;
            let fifteens = 0;
            for (let mask = 1; mask < (1 << n); mask++) {
                let s = 0;
                for (let k = 0; k < n; k++) {
                    if (mask & (1 << k)) {
                        s += cbValue(all[k]);
                    }
                }
                if (s === 15) {
                    fifteens += 2;
                }
            }
            let pairs = 0;
            for (let a = 0; a < n; a++) {
                for (let b = a + 1; b < n; b++) {
                    if (all[a].r === all[b].r) {
                        pairs += 2;
                    }
                }
            }
            // runs: each longest stretch of ranks of three or more, once for every way to make it
            const counts = new Array(15).fill(0);
            for (const c of all) {
                counts[c.r]++;
            }
            let runs = 0;
            for (let r = 1; r <= 13;) {
                if (!counts[r]) {
                    r++;
                    continue;
                }
                let len = 0, ways = 1;
                while (r + len <= 13 && counts[r + len]) {
                    ways *= counts[r + len];
                    len++;
                }
                if (len >= 3) {
                    runs += len * ways;
                }
                r += len;
            }
            let flush = 0;
            if (hand.length === 4 && hand.every((c) => c.s === hand[0].s)) {
                if (starter && starter.s === hand[0].s) {
                    flush = 5;
                } else if (!crib) {
                    flush = 4;
                }
            }
            const nobs = starter && hand.some((c) => c.r === 11 && c.s === starter.s) ? 1 : 0;
            return { total: fifteens + pairs + runs + flush + nobs, fifteens, pairs, runs, flush, nobs };
        }

        // What laying the last card of pile (the cards since the count was 0) pegs:
        // {points, count, fifteen, thirtyOne, kind (how many of a kind, 1 = none), run (its length, 0 = none)}.
        function cbPegPoints(pile) {
            const count = cbSum(pile);
            const last = pile[pile.length - 1];
            let kind = 1;
            for (let k = pile.length - 2; k >= 0 && pile[k].r === last.r; k--) {
                kind++;
            }
            let run = 0;
            for (let len = pile.length; len >= 3; len--) {
                const ranks = pile.slice(-len).map((c) => c.r).sort((a, b) => a - b);
                if (ranks.every((r, k) => k === 0 || r === ranks[k - 1] + 1)) {
                    run = len;
                    break;
                }
            }
            const fifteen = count === 15, thirtyOne = count === 31;
            const points = (fifteen ? 2 : 0) + (thirtyOne ? 2 : 0) + [0, 0, 2, 6, 12][kind] + run;
            return { points, count, fifteen, thirtyOne, kind, run };
        }

        // ---- opponent AI ----

        // A rough worth of two cards in a crib: what they make together, and the cards that make
        // fifteens and runs with most others.
        function cbCribGuess(toss) {
            const [a, b] = toss;
            let v = 0;
            if (a.r === b.r) {
                v += 2;
            }
            if (cbValue(a) + cbValue(b) === 15) {
                v += 2;
            }
            v += (a.r === 5 ? 1.5 : 0) + (b.r === 5 ? 1.5 : 0);
            const gap = Math.abs(a.r - b.r);
            v += gap === 1 ? 1 : gap === 2 ? 0.5 : 0;
            if (a.s === b.s) {
                v += 0.25;
            }
            return v;
        }

        // The two of these six cards that go to the crib. dealer: the crib is this seat's.
        // 1: any two. 2: keep the best four as they stand. 3 and 4: keep the four best on average
        // over every starter, the crib reckoned in (4 also keeps fewer cards that give the
        // opponent's crib fives).
        function cbChooseDiscard(six, dealer, lvl) {
            const options = [];
            for (let a = 0; a < 6; a++) {
                for (let b = a + 1; b < 6; b++) {
                    options.push({ keep: six.filter((_, k) => k !== a && k !== b), toss: [six[a], six[b]] });
                }
            }
            if (lvl <= 1) {
                return options[Math.floor(Math.random() * options.length)].toss;
            }
            const rest = [];
            if (lvl >= 3) {
                for (let s = 0; s < 4; s++) {
                    for (let r = 1; r <= 13; r++) {
                        if (!six.some((c) => c.r === r && c.s === s)) {
                            rest.push({ r, s });
                        }
                    }
                }
            }
            const worth = (o) => {
                const hand = lvl >= 3
                    ? rest.reduce((a, s) => a + cbScore(o.keep, s, false).total, 0) / rest.length
                    : cbScore(o.keep, null, false).total;
                let crib = cbCribGuess(o.toss);
                if (lvl >= 4 && !dealer) {
                    crib += o.toss.filter((c) => c.r === 5).length;
                }
                return hand + (dealer ? crib : -crib) + (lvl === 2 ? Math.random() * 1.5 : 0);
            };
            const scored = options.map((o) => ({ o, v: worth(o) }));
            return scored.reduce((a, x) => (x.v > a.v ? x : a)).o.toss;
        }

        // The card to lay from hand with these cards in the count. 1: any that fits. Above: what
        // it pegs now, less what it leaves the other side (a count of 5 or 21 invites a ten-card,
        // a lead of 5 the same), leading low, and from 3 on, spending high cards while the count
        // is low so the low ones are left for the go.
        function cbChoosePlay(hand, pile, lvl) {
            const count = cbSum(pile);
            const playable = hand.filter((c) => count + cbValue(c) <= 31);
            if (playable.length <= 1) {
                return playable[0];
            }
            if (lvl <= 1) {
                return playable[Math.floor(Math.random() * playable.length)];
            }
            const rate = (c) => {
                const after = count + cbValue(c);
                let v = cbPegPoints([...pile, c]).points * 10;
                if (after === 5 || after === 21) {
                    v -= 4;
                }
                if (!pile.length) {
                    v += cbValue(c) < 5 ? 2 : 0;
                    v -= c.r === 5 ? 3 : 0;
                }
                if (lvl >= 3 && after < 21) {
                    v += cbValue(c) * 0.15;
                }
                if (lvl >= 4 && pile.length && pile[pile.length - 1].r === c.r && after + cbValue(c) <= 31) {
                    v -= 2;    // a pair invites three of a kind
                }
                return v + (lvl === 2 ? Math.random() * 3 : 0);
            };
            const scored = playable.map((c) => ({ c, v: rate(c) }));
            return scored.reduce((a, x) => (x.v > a.v ? x : a)).c;
        }

        // ---- text ----

        function cbCardText(c) {
            const ranks = t("cbRanks").split(",");
            const suits = t("cbSuits").split(",");
            return t("cbCard", { rank: (ranks[c.r - 1] || String(c.r)).trim(), suit: (suits[c.s] || "").trim() });
        }

        const cbCardsText = (cards) => cards.map(cbCardText).join(t("listComma"));

        function cbPartsText(sc) {
            const parts = [];
            if (sc.fifteens) parts.push(t("cbFifteens", { n: sc.fifteens }));
            if (sc.pairs) parts.push(t("cbPairs", { n: sc.pairs }));
            if (sc.runs) parts.push(t("cbRuns", { n: sc.runs }));
            if (sc.flush) parts.push(t("cbFlush", { n: sc.flush }));
            if (sc.nobs) parts.push(t("cbNobs"));
            return parts.length ? parts.join(t("listComma")) : t("cbNothing");
        }

        function cbPegText(p) {
            const parts = [];
            if (p.fifteen) parts.push(t("cbPegFifteen"));
            if (p.thirtyOne) parts.push(t("cbPegThirtyOne"));
            if (p.kind >= 2) parts.push(t("cbPegKind" + p.kind));
            if (p.run) parts.push(t("cbPegRun", { n: p.run }));
            return parts.join(t("listComma"));
        }

        // ---- flow ----

        // The opponent's strength, 1 to 4: from the plugin when it passes one (cbLevel), else Normal,
        // and set during play by the four steps on the panel. Read at every decision, so a change
        // counts from the next one.
        let cbLevel = 2;

        function onCbLevel(v) {
            cbLevel = Math.min(4, Math.max(1, Number(v) || 2));
            renderCb();
        }

        const cb = {
            gen: 0,          // bumped when a game is left or dropped: its pending steps stop
            seats: [],       // 0 the player, 1 the NPC: {id, name, human, score, hand (kept four), peg (still to lay)}
            dealer: 0,
            phase: "discard", // discard | peg | show
            deck: [],
            crib: [],
            starter: null,
            pile: [],        // the cards in the count now
            count: 0,
            turn: 0,         // whose card it is
            lastPlayer: -1,  // who laid the last card
            said: [false, false],  // said go in this count
            picked: [],      // the player's picks for the crib
            show: [],        // the hands counted: {seat, crib, cards, score}
            handNo: 0,
            playing: false,
            over: false,
            left: false,     // the player left before the end
            winner: -1,
            thinking: false, // an NPC's card is on its way
            leaveArmed: false,
        };

        const cbName = (k) => cb.seats[k].name;
        const cbNpc = () => cb.seats[1];
        const cbPlayable = (k) => cb.seats[k].peg.filter((c) => cb.count + cbValue(c) <= 31);
        const cbPlayerActs = () => cb.playing && !cb.over && !cb.thinking && screen === "cb";

        function cbNewGame(opp) {
            cb.gen++;
            cb.seats = [
                { id: "", name: playerName, human: true, score: 0, hand: [], peg: [] },
                { id: opp.id, name: opp.name, human: false, score: 0, hand: [], peg: [] },
            ];
            cb.playing = true;
            cb.over = false;
            cb.left = false;
            cb.winner = -1;
            cb.handNo = 0;
            cb.thinking = false;
            cb.leaveArmed = false;
            $("cb-log").innerHTML = "";
            // cut for the deal: the lower card deals
            let mine, theirs;
            do {
                const deck = newDeck();
                mine = deck[0];
                theirs = deck[1];
            } while (mine.r === theirs.r);
            cb.dealer = mine.r < theirs.r ? 0 : 1;
            log(t("cbLogCutDeal", { player: playerName, mine: cbCardText(mine), npc: opp.name, theirs: cbCardText(theirs), dealer: cbName(cb.dealer) }), "cb-log");
            say(opp.id, t("cbSayStart", { player: playerName, npc: opp.name, dealer: cbName(cb.dealer) }));
            cbDeal();
        }

        function cbDeal() {
            cb.handNo++;
            cb.deck = newDeck();
            cb.crib = [];
            cb.starter = null;
            cb.pile = [];
            cb.count = 0;
            cb.lastPlayer = -1;
            cb.said = [false, false];
            cb.picked = [];
            cb.show = [];
            cb.phase = "discard";
            cb.leaveArmed = false;
            for (const s of cb.seats) {
                s.hand = cb.deck.splice(0, 6);
                s.peg = [];
            }
            log(t("cbLogHandStart", { n: cb.handNo, dealer: cbName(cb.dealer) }), "cb-log");
            // the NPC picks at once; their two lie face down until the crib is shown
            const npc = cbNpc();
            const toss = cbChooseDiscard(npc.hand, cb.dealer === 1, cbLevel);
            npc.hand = npc.hand.filter((c) => !toss.includes(c));
            cb.crib.push(...toss);
            reportCbState();
            renderCb();
        }

        // seat k pegs n; true if that wins the game (which is then over).
        function cbAward(k, n) {
            const s = cb.seats[k];
            s.score = Math.min(CB_TARGET, s.score + n);
            if (s.score >= CB_TARGET) {
                cbEnd(k);
                return true;
            }
            return false;
        }

        // Both cribs are in: the starter is cut, and the play begins with the pone.
        function cbCut() {
            cb.starter = cb.deck.pop();
            log(t("cbLogStarter", { card: cbCardText(cb.starter) }), "cb-log");
            if (cb.starter.r === 11) {
                log(t("cbLogHeels", { who: cbName(cb.dealer) }), "cb-log");
                if (cb.dealer === 1) {
                    say(cbNpc().id, t("cbSayHeels", { npc: cbNpc().name, player: playerName }));
                }
                if (cbAward(cb.dealer, 2)) {
                    return;
                }
            }
            cb.phase = "peg";
            for (const s of cb.seats) {
                s.peg = s.hand.slice();
            }
            cb.turn = 1 - cb.dealer;
            reportCbState();
            cbPegStep();
        }

        function cbNewCount() {
            cb.count = 0;
            cb.pile = [];
            cb.said = [false, false];
            cb.turn = 1 - cb.lastPlayer;
        }

        // The play goes on: a go, the go point and a new count, the show, or someone's card.
        function cbPegStep() {
            renderCb();
            if (!cb.playing || cb.over || cb.phase !== "peg" || cb.thinking) {
                return;
            }
            if (!cb.seats[0].peg.length && !cb.seats[1].peg.length) {
                if (cb.count > 0 && cb.count < 31) {
                    log(t("cbLogLast", { who: cbName(cb.lastPlayer) }), "cb-log");
                    if (cbAward(cb.lastPlayer, 1)) {
                        return;
                    }
                }
                cbShow();
                return;
            }
            const k = cb.turn, o = 1 - k;
            if (!cbPlayable(k).length) {
                if (!cb.said[k] && cb.seats[k].peg.length) {
                    cb.said[k] = true;
                    log(t("cbLogGo", { who: cbName(k), count: cb.count }), "cb-log");
                }
                if (cbPlayable(o).length) {
                    cb.turn = o;
                    cbPegStep();
                    return;
                }
                // nobody can lay a card: the last to play pegs one, and the count starts again
                if (cb.count > 0 && cb.count < 31) {
                    log(t("cbLogGoPoint", { who: cbName(cb.lastPlayer) }), "cb-log");
                    if (cbAward(cb.lastPlayer, 1)) {
                        return;
                    }
                }
                cbNewCount();
                cbPegStep();
                return;
            }
            if (cb.seats[k].human) {
                reportCbState();
                return;    // the player lays a card from the board
            }
            cb.thinking = true;
            const gen = cb.gen;
            renderCbStatus();
            whenQuiet(() => {
                if (gen !== cb.gen) {
                    return;
                }
                if (screen !== "cb") {
                    cb.thinking = false;
                    return;
                }
                renderCbStatus();
                setTimeout(() => {
                    if (gen !== cb.gen) {
                        return;
                    }
                    cb.thinking = false;
                    if (screen !== "cb") {
                        return;
                    }
                    cbPlay(1, cbChoosePlay(cbNpc().peg, cb.pile, cbLevel));
                }, 700 + Math.random() * 500);
            });
        }

        // Seat k lays card c.
        function cbPlay(k, c) {
            const s = cb.seats[k];
            s.peg = s.peg.filter((x) => x !== c);
            cb.pile.push(c);
            cb.count += cbValue(c);
            cb.lastPlayer = k;
            cb.leaveArmed = false;
            const p = cbPegPoints(cb.pile);
            log(t(p.points ? "cbLogPlayPoints" : "cbLogPlay", { who: s.name, card: cbCardText(c), count: cb.count, how: cbPegText(p), n: p.points }), "cb-log");
            if (p.points >= 6 || (p.points >= 4 && p.run)) {
                const v = { who: s.name, npc: cbNpc().name, player: playerName, card: cbCardText(c), how: cbPegText(p), n: p.points };
                say(cbNpc().id, t(s.human ? "cbSayBigPegPlayer" : "cbSayBigPegNpc", v));
            }
            if (p.points && cbAward(k, p.points)) {
                return;
            }
            if (cb.count === 31) {
                cbNewCount();
            } else {
                cb.turn = 1 - k;
            }
            reportCbState();
            cbPegStep();
        }

        // The hands are counted: the pone's, the dealer's, then the crib.
        function cbShow() {
            cb.phase = "show";
            const pone = 1 - cb.dealer;
            const order = [
                { seat: pone, crib: false, cards: cb.seats[pone].hand },
                { seat: cb.dealer, crib: false, cards: cb.seats[cb.dealer].hand },
                { seat: cb.dealer, crib: true, cards: cb.crib },
            ];
            cb.show = [];
            for (const o of order) {
                const score = cbScore(o.cards, cb.starter, o.crib);
                cb.show.push({ ...o, score });
                log(t(o.crib ? "cbLogCrib" : "cbLogShow", { who: cbName(o.seat), n: score.total, how: cbPartsText(score) }), "cb-log");
                if (score.total && cbAward(o.seat, score.total)) {
                    return;
                }
            }
            const npc = cbNpc();
            const shown = (seat, crib) => cb.show.find((x) => x.seat === seat && x.crib === crib).score.total;
            say(npc.id, t("cbSayShow", {
                npc: npc.name, player: playerName, dealer: cbName(cb.dealer),
                n: shown(1, false), h: shown(0, false), c: shown(cb.dealer, true),
                ns: npc.score, hs: cb.seats[0].score,
            }));
            reportCbState();
            renderCb();
        }

        // k won (reached 121).
        function cbEnd(k) {
            cb.over = true;
            cb.winner = k;
            cb.thinking = false;
            const loser = cb.seats[1 - k];
            const skunk = loser.score < CB_SKUNK;
            log(t("cbLogEnd", { result: cbResult() }), "cb-log");
            const v = { npc: cbNpc().name, player: playerName, ns: cbNpc().score, hs: cb.seats[0].score, loser: loser.name };
            say(cbNpc().id, t(k === 0 ? "cbSayPlayerWins" : "cbSayNpcWins", v) + (skunk ? t("cbSaySkunk", v) : ""), true);
            reportCbState();
            renderCb();
        }

        function cbResult() {
            const w = cb.seats[cb.winner], l = cb.seats[1 - cb.winner];
            return t("cbResult", { name: w.name, w: w.score, l: l.score }) + (l.score < CB_SKUNK ? t("cbResultSkunk") : "");
        }

        // ---- the player's moves ----

        function onCbCard(c) {
            if (!cbPlayerActs()) {
                return;
            }
            if (cb.phase === "discard" && cb.seats[0].hand.length === 6) {
                const k = cb.picked.indexOf(c);
                if (k >= 0) {
                    cb.picked.splice(k, 1);
                } else if (cb.picked.length < 2) {
                    cb.picked.push(c);
                }
                renderCb();
            } else if (cb.phase === "peg" && cb.turn === 0 && cbPlayable(0).includes(c)) {
                cbPlay(0, c);
            }
        }

        function onCbCrib() {
            if (!cbPlayerActs() || cb.phase !== "discard" || cb.picked.length !== 2) {
                return;
            }
            const me = cb.seats[0];
            me.hand = me.hand.filter((c) => !cb.picked.includes(c));
            cb.crib.push(...cb.picked);
            cb.picked = [];
            cbCut();
        }

        function onCbNext() {
            if (!cbPlayerActs() || cb.phase !== "show") {
                return;
            }
            cb.dealer = 1 - cb.dealer;
            cbDeal();
        }

        function onCbLeave() {
            if (!cb.playing || cb.over) {
                return;
            }
            if (!cb.leaveArmed) {
                cb.leaveArmed = true;
                renderCb();
                return;
            }
            cb.gen++;
            cb.over = true;
            cb.left = true;
            cb.thinking = false;
            cb.leaveArmed = false;
            say(cbNpc().id, t("cbSayLeave", { player: playerName, npc: cbNpc().name }), true);
            log(t("logLeave", { player: playerName }), "cb-log");
            reportCbState();
            renderCb();
        }

        function onCbAgain() {
            cbNewGame({ id: cbNpc().id, name: cbNpc().name });
        }

        // ---- what the NPC knows ----

        function cbStateFor() {
            const npc = cbNpc();
            const v = { npc: npc.name, player: playerName };
            if (cb.over) {
                if (screen !== "cb") {
                    return "";
                }
                return cb.left ? t("cbStateLeft", v) : t("cbStateResult", { ...v, result: cbResult() });
            }
            if (!cb.playing) {
                return "";
            }
            let text = t("cbState", { ...v, ns: npc.score, hs: cb.seats[0].score, dealer: cbName(cb.dealer) });
            if (cb.phase === "discard") {
                text += t("cbStateDiscard", { npc: npc.name, cards: cbCardsText(npc.hand) });
            } else if (cb.phase === "peg") {
                text += t("cbStatePeg", { npc: npc.name, starter: cbCardText(cb.starter), count: cb.count, cards: npc.peg.length ? cbCardsText(npc.peg) : t("cbNoCards") });
                text += t("cbStateTurn", { who: cbName(cb.turn) });
            } else if (cb.phase === "show") {
                text += t("cbStateShow", { how: cb.show.map((x) => t(x.crib ? "cbShownCrib" : "cbShownHand", { who: cbName(x.seat), n: x.score.total })).join(t("listComma")) });
            }
            if (screen !== "cb") {
                text += t("cbStatePaused");
            }
            return text;
        }

        function reportCbState() {
            if (activeGame !== "cb" || !cb.seats.length) {
                return;
            }
            send("rvState", JSON.stringify({ states: { [cbNpc().id]: cbStateFor() }, playing: cb.playing && !cb.over }));
        }

        // A game in progress is dropped (another game is starting).
        function abandonCribbage() {
            if (cb.playing && !cb.over) {
                cb.playing = false;
                cb.gen++;
                cb.thinking = false;
                voiceReset();
            }
        }

        // Starts or resumes cribbage against opp ({id, name}).
        function playCribbage(opp) {
            const same = cb.playing && !cb.over && cb.seats.length && cbNpc().id === opp.id;
            if (!same) {
                abandonCribbage();
            }
            abandonReversi();
            abandonDice();
            abandonStb();
            abandonBj();
            abandonPk();
            abandonCheckers();
            activeGame = "cb";
            send("mgPlayers", opp.id);
            if (same) {
                showScreen("cb");
                log(t("logResume"), "cb-log");
                reportCbState();
                cbPegStep();
                return;
            }
            snapFaces([opp.id], () => {
                showScreen("cb");
                cbNewGame(opp);
            });
        }

        // ---- rendering ----

        function cbCardEl(c, size, faceDown, onClick, cls = "") {
            const el = cardEl(c, size, faceDown);
            if (cls) {
                el.className += " " + cls;
            }
            if (onClick) {
                el.onclick = onClick;
            }
            return el;
        }

        function renderCb() {
            if (!cb.seats.length) {
                return;
            }
            const live = cb.playing && !cb.over;
            const me = cb.seats[0], npc = cbNpc();
            const shownUp = cb.phase === "show" || cb.over;
            const acts = cbPlayerActs();

            // the NPC
            $("cb-face").dataset.face = npc.id;
            paintFace($("cb-face"), npc.id, npc.name);
            $("cb-npc-name").textContent = npc.name + (cb.dealer === 1 ? t("cbDealerMark") : "");
            const npcHand = $("cb-npc-hand");
            npcHand.innerHTML = "";
            const npcCards = shownUp ? npc.hand : cb.phase === "peg" ? npc.peg : npc.hand;
            npcCards.forEach((c) => npcHand.appendChild(cbCardEl(c, "mid", !shownUp)));
            $("cb-npc-seat").classList.toggle("active", live && cb.phase === "peg" && cb.turn === 1);

            // the middle: starter, crib, the count
            const starter = $("cb-starter");
            starter.innerHTML = "";
            if (cb.starter) {
                starter.appendChild(cbCardEl(cb.starter, "mid", false));
            } else {
                starter.appendChild(cbCardEl({ r: 1, s: 0 }, "mid", true));
            }
            $("cb-crib-label").textContent = t("cbCribOf", { who: cbName(cb.dealer) });
            const crib = $("cb-crib");
            crib.innerHTML = "";
            cb.crib.forEach((c) => crib.appendChild(cbCardEl(c, "small", !shownUp)));
            const pile = $("cb-pile");
            pile.innerHTML = "";
            cb.pile.forEach((c) => pile.appendChild(cbCardEl(c, "mid", false)));
            $("cb-count").textContent = cb.phase === "peg" ? t("cbCount", { n: cb.count }) : "";

            // the player
            $("cb-mine-name").textContent = me.name + (cb.dealer === 0 ? t("cbDealerMark") : "");
            const mine = $("cb-mine-hand");
            mine.innerHTML = "";
            if (cb.phase === "discard" && !cb.over) {
                me.hand.forEach((c) => {
                    const cls = cb.picked.includes(c) ? "picked" : acts && me.hand.length === 6 ? "can" : "";
                    mine.appendChild(cbCardEl(c, "big", false, () => onCbCard(c), cls));
                });
            } else if (cb.phase === "peg" && !cb.over) {
                const playable = acts && cb.turn === 0 ? cbPlayable(0) : [];
                me.peg.forEach((c) => {
                    const cls = playable.includes(c) ? "can" : cb.turn === 0 && acts ? "dim" : "";
                    mine.appendChild(cbCardEl(c, "big", false, () => onCbCard(c), cls));
                });
            } else {
                me.hand.forEach((c) => mine.appendChild(cbCardEl(c, "big", false)));
            }
            $("cb-mine").classList.toggle("active", live && cb.phase === "peg" && cb.turn === 0);

            // scores
            for (const [k, id] of [[1, "npc"], [0, "me"]]) {
                $("cb-score-" + id + "-name").textContent = cbName(k);
                $("cb-score-" + id).textContent = cb.seats[k].score;
                $("cb-bar-" + id).style.width = (cb.seats[k].score / CB_TARGET) * 100 + "%";
            }

            $("cb-meta").textContent = t("strength", { level: t("level" + cbLevel) });
            renderLevelSteps("cb-level", cbLevel);
            $("cb-crib-button").style.display = live && cb.phase === "discard" ? "" : "none";
            $("cb-crib-button").disabled = !acts || cb.picked.length !== 2;
            $("cb-next").style.display = live && cb.phase === "show" ? "" : "none";
            $("cb-leave").style.display = live ? "" : "none";
            $("cb-leave").textContent = t(cb.leaveArmed ? "leaveConfirm" : "leave");
            $("cb-again").style.display = cb.over ? "" : "none";
            renderCbStatus();
        }

        function renderCbStatus() {
            if (!cb.seats.length) {
                return;
            }
            const npc = cbNpc();
            let text = "";
            if (cb.over) {
                if (cb.left) {
                    text = t("diceLeftStatus");
                } else {
                    text = t(cb.winner === 0 ? "cbYouWin" : "cbNpcWins", { npc: npc.name, w: cb.seats[cb.winner].score, l: cb.seats[1 - cb.winner].score });
                    if (cb.seats[1 - cb.winner].score < CB_SKUNK) {
                        text += t("cbSkunkStatus");
                    }
                }
            } else if (cb.playing) {
                if (cb.phase === "discard") {
                    text = t(cb.dealer === 0 ? "cbYourCrib" : "cbTheirCrib", { npc: npc.name });
                } else if (cb.phase === "show") {
                    const lines = cb.show.map((x) => t(x.crib ? "cbShownCrib" : "cbShownHand", { who: cbName(x.seat), n: x.score.total }));
                    text = t("cbShowStatus", { how: lines.join(t("listComma")) });
                } else if (cb.turn === 0 && !cb.thinking) {
                    text = t("cbYourPlay", { n: cb.count });
                } else if (voiceLine && voiceLine.speaker !== PLAYER_ID) {
                    text = t("diceListening", { npc: npc.name });
                } else {
                    text = t("thinking", { npc: npc.name });
                }
            }
            $("cb-status").textContent = text;
        }

        // ===== faces =====

        // A new game calls its opponents over (MCM) and takes a photo: the screen goes black
        // (mgGather), clears for the shot with the board out of the way (mgUncover), and each face
        // is cropped out of the photo (mgFaces). Without a face, the frame shows an initial.
        let gatherOn = true;
        let photoOn = true;       // MCM: without the photo, the frames show initials
        let faces = {};           // id -> {file, x, y, w, h}: the crop, as fractions of the photo
        let speaking = {};        // id -> until when (performance.now) the frame lights up
        let snapping = null;      // the photo being taken: {done}

        function snapFaces(ids, then) {
            if (!photoOn) {
                faces = {};
            }
            if (typeof window.mgGather !== "function" || (!photoOn && !gatherOn)) {
                then();           // a plain browser, or nothing to do first
                return;
            }
            const job = {
                done() {
                    if (snapping !== job) return;
                    snapping = null;
                    document.body.classList.remove("snapping");
                    $("curtain").classList.remove("on", "block");
                    then();
                },
            };
            snapping = job;
            $("curtain").classList.add("block");
            if (gatherOn) {
                $("curtain").classList.add("on");
            }
            setTimeout(() => send("mgGather", ids.join(",")), gatherOn ? 350 : 0);
            setTimeout(job.done, 6000);   // no answer: play on without faces
        }

        window.mgUncover = () => {
            document.body.classList.add("snapping");
            $("curtain").classList.remove("on");
        };

        window.mgFaces = (photo) => {
            for (const [id, crop] of Object.entries(photo.faces || {})) {
                faces[id] = { file: photo.file, ...crop };
            }
            if (snapping) {
                snapping.done();
            }
            document.querySelectorAll("[data-face]").forEach((el) => paintFace(el, el.dataset.face, el.dataset.name));
        };

        function paintFace(el, id, name) {
            const f = faces[id];
            el.dataset.name = name || "";
            el.classList.toggle("speaking", (speaking[id] || 0) > performance.now());
            if (!f) {
                el.style.backgroundImage = "";
                el.textContent = (name || "?").slice(0, 1);
                return;
            }
            el.textContent = "";
            el.style.backgroundImage = `url("${f.file}")`;
            el.style.backgroundSize = `${100 / f.w}% ${100 / f.h}%`;
            el.style.backgroundPosition = `${f.w < 1 ? (f.x / (1 - f.w)) * 100 : 0}% ${f.h < 1 ? (f.y / (1 - f.h)) * 100 : 0}%`;
        }

        function faceEl(id, name, cls = "") {
            const el = document.createElement("div");
            el.className = "face " + cls;
            el.dataset.face = id;
            paintFace(el, id, name);
            return el;
        }

        // id is talking for about ms: their frame lights up.
        function markSpeaking(id, ms) {
            speaking[id] = performance.now() + ms;
            const refresh = () => document.querySelectorAll("[data-face]").forEach((el) =>
                el.classList.toggle("speaking", (speaking[el.dataset.face] || 0) > performance.now()));
            refresh();
            setTimeout(refresh, ms + 50);
        }

        // ===== screens =====

        // "menu", "board" (Reversi), "dice", "stb", "bj", "pk", or null when the plugin has hidden the view. A
        // game counts as hidden (paused) whenever its screen is not up.
        let screen = null;
        let activeGame = null;    // "reversi" | "dice" | "stb" | "bj" | "pk": the game whose state the NPCs see

        function showScreen(name) {
            screen = name;
            $("menu").classList.toggle("open", name === "menu");
            $("panel").classList.toggle("open", name === "board");
            $("dice").classList.toggle("open", name === "dice");
            $("stb").classList.toggle("open", name === "stb");
            $("bj").classList.toggle("open", name === "bj");
            $("pk").classList.toggle("open", name === "pk");
            $("ck").classList.toggle("open", name === "ck");
            $("cb").classList.toggle("open", name === "cb");
            hidden = name !== "board";
            fitPanels();
        }

        // Everything is drawn this much larger, unless the open panel would not fit the screen.
        const UI_ZOOM = 1.5;

        function fitPanels() {
            for (const el of document.querySelectorAll(".panel.open")) {
                el.style.zoom = 1;
                const fit = Math.min((window.innerWidth * 0.96) / el.offsetWidth, (window.innerHeight * 0.96) / el.offsetHeight);
                el.style.zoom = Math.min(UI_ZOOM, fit);
            }
        }

        window.addEventListener("resize", fitPanels);

        // The prompts of whoever plays the active game, for the plugin.
        function reportActive() {
            if (activeGame === "reversi") {
                reportState();
            } else if (activeGame === "dice") {
                reportDiceState();
            } else if (activeGame === "stb") {
                reportStbState();
            } else if (activeGame === "bj") {
                reportBjState();
            } else if (activeGame === "pk") {
                reportPkState();
            } else if (activeGame === "ck") {
                reportCkState();
            } else if (activeGame === "cb") {
                reportCbState();
            }
        }

        // A Reversi game in progress is dropped (another game is starting).
        function abandonReversi() {
            if (playing && !over) {
                playing = false;
            }
        }

        // Starts or resumes Reversi against opp ({id, name}); invite: opp challenged the player.
        function playReversi(opp, invite) {
            abandonDice();
            abandonStb();
            abandonBj();
            abandonPk();
            activeGame = "reversi";
            abandonCheckersAndCribbage();
            const sameOpponent = opp.id === opponent.id;
            if (!sameOpponent && playing && !over) {
                // a game with someone else is left behind (reported while the plugin still has
                // the old opponent, so their busy state and prompt are cleared)
                playing = false;
                reportState();
            }
            opponent = opp;
            send("mgPlayers", opp.id);
            showScreen("board");
            renderPlayers();

            if (invite) {
                showInvite(true);
                render();
                return;
            }
            showInvite(false);
            if (sameOpponent && playing && !over) {
                // carry on where the game was left
                log(t("logResume"));
                reportState();
                render();
                nextTurn();
                return;
            }
            snapFaces([opp.id], newGame);
        }

        // ===== menu =====

        // The games on offer. opponents: how many NPCs may sit at the table.
        const GAMES = [
            { id: "reversi", title: "gameReversi", desc: "gameReversiDesc", opponents: 1, start: (chosen) => playReversi(chosen[0], false) },
            { id: "dice", title: "gameDice", desc: "gameDiceDesc", opponents: 3, start: (chosen) => playDice(chosen) },
            { id: "stb", title: "gameStb", desc: "gameStbDesc", opponents: 3, start: (chosen) => playStb(chosen) },
            { id: "bj", title: "gameBj", desc: "gameBjDesc", opponents: 3, start: (chosen) => {
                if (bjUnfinishedWith(chosen)) {
                    playBj(chosen);
                } else {
                    chooseDealer(chosen, (dealer) => playBj(chosen, dealer));
                }
            } },
            { id: "pk", title: "gamePk", desc: "gamePkDesc", opponents: 3, start: (chosen) => playPk(chosen) },
